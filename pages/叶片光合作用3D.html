<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>叶片的秘密 · 光合作用 3D 剖面</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#030906}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    color:#eafff2;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 70% 60% at 72% 12%, rgba(122,214,92,.20) 0%, rgba(20,60,34,.10) 40%, transparent 70%),
      radial-gradient(ellipse 100% 80% at 50% 55%, #0a2416 0%, #051209 48%, #030906 100%);
  }
  #c{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #c:active{cursor:grabbing}

  /* 阳光光晕 */
  .sun{
    position:fixed;right:-8vw;top:-14vh;width:52vw;height:52vw;z-index:1;pointer-events:none;
    background:radial-gradient(circle at 50% 50%, rgba(255,240,180,.30) 0%, rgba(190,255,150,.13) 22%, rgba(120,200,90,.05) 45%, transparent 68%);
    filter:blur(6px);
  }
  .rays{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.30;
    background:repeating-linear-gradient(116deg,
      rgba(255,255,220,.09) 0px, rgba(255,255,220,.09) 1px,
      transparent 1px, transparent 118px);
    -webkit-mask-image:radial-gradient(ellipse 60% 50% at 72% 8%, #000 0%, transparent 72%);
    mask-image:radial-gradient(ellipse 60% 50% at 72% 8%, #000 0%, transparent 72%);
  }
  .vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse 78% 70% at 50% 48%, transparent 40%, rgba(0,4,2,.55) 100%)}

  .hud{
    position:fixed;z-index:20;
    background:rgba(9,24,16,.55);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    backdrop-filter:blur(18px) saturate(150%);
    border:1px solid rgba(168,255,190,.13);
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .hud.tl{left:26px;top:26px;padding:17px 24px 19px;pointer-events:none}
  .eyebrow{font-size:10px;letter-spacing:.36em;color:rgba(190,255,205,.45);margin-bottom:9px}
  .hud h1{font-size:27px;font-weight:600;letter-spacing:.05em;line-height:1.08;
    background:linear-gradient(178deg,#f4fff4 0%,#a8ef7c 120%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hud .sub{font-size:11.5px;color:rgba(198,255,210,.48);margin-top:8px;letter-spacing:.08em}

  .hud.tr{right:26px;top:26px;padding:11px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
  button{
    font-family:inherit;font-size:13px;letter-spacing:.06em;color:#eaffee;cursor:pointer;
    border:1px solid rgba(180,255,200,.16);border-radius:12px;
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.025));
    padding:11px 20px;min-width:166px;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .18s cubic-bezier(.2,.8,.3,1),background .2s,border-color .2s,box-shadow .25s;
  }
  button:hover{transform:translateY(-1px);border-color:rgba(190,255,210,.34);background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.04))}
  button:active{transform:translateY(0) scale(.985)}
  button.on{
    background:linear-gradient(180deg,#63c04a,#2b7a2a);
    border-color:rgba(180,255,160,.55);
    box-shadow:0 8px 26px rgba(90,200,80,.38),inset 0 1px 0 rgba(255,255,255,.28);
  }
  .ico{font-size:13px;line-height:1;opacity:.9}

  .hud.bl{left:26px;bottom:26px;padding:14px 18px;display:flex;flex-direction:column;gap:9px;pointer-events:none}
  .legend{display:flex;align-items:center;gap:10px;font-size:11.5px;color:rgba(215,255,225,.62);letter-spacing:.05em}
  .legend b{font-weight:500;color:rgba(235,255,240,.88)}
  .d{width:8px;height:8px;border-radius:50%;display:block;flex:0 0 auto}
  .d.photon{background:#ffe98a;box-shadow:0 0 10px rgba(255,233,138,.9)}
  .d.water{background:#6cc2f7;box-shadow:0 0 10px rgba(108,194,247,.9)}
  .d.sugar{background:#ffb954;box-shadow:0 0 10px rgba(255,185,84,.9)}
  .d.air{background:#9ff6ff;box-shadow:0 0 10px rgba(159,246,255,.9)}

  .meter{margin-top:2px;padding-top:10px;border-top:1px solid rgba(168,255,190,.12);
    display:flex;flex-direction:column;gap:7px;font-size:11px;color:rgba(200,255,212,.45);letter-spacing:.05em}
  .row{display:flex;align-items:center;gap:9px}
  .row span:last-child{margin-left:auto;color:rgba(226,255,232,.82);font-variant-numeric:tabular-nums}
  .bar{width:74px;height:3px;border-radius:2px;background:rgba(255,255,255,.10);overflow:hidden}
  .bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#4dbb5c,#b6ff7a);border-radius:2px;transition:width .2s linear}
  .sunbtn{display:flex;align-items:center;gap:8px;cursor:pointer;pointer-events:auto;user-select:none;
    padding:6px 10px;margin:-4px -6px;border-radius:9px;transition:background .2s}
  .sunbtn:hover{background:rgba(255,255,255,.06)}
  .sunbtn .lamp{width:7px;height:7px;border-radius:50%;background:#ffd987;box-shadow:0 0 12px rgba(255,217,135,.95)}
  .sunbtn.off .lamp{background:#4a5a4e;box-shadow:none}
  .sunbtn.off{color:rgba(255,255,255,.3)}

  .hud.bc{left:50%;transform:translateX(-50%);bottom:26px;padding:9px 20px;font-size:11.5px;
    color:rgba(210,255,222,.42);letter-spacing:.12em;border-radius:100px;pointer-events:none}
  .hud.bc kbd{font-family:inherit;color:rgba(230,255,236,.72);padding:0 2px}

  /* 部件标签 */
  #labels{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
  .label{
    position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;
    padding:5px 12px 5px 8px;border-radius:100px;white-space:nowrap;
    background:rgba(9,22,14,.78);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid rgba(180,255,200,.18);
    font-size:12.5px;letter-spacing:.06em;color:rgba(232,255,238,.9);
    box-shadow:0 8px 26px rgba(0,0,0,.5);
    transition:opacity .3s ease;opacity:0;will-change:transform,opacity;
  }
  .label .dt{width:6px;height:6px;border-radius:50%;background:#a8f078;box-shadow:0 0 9px rgba(168,240,120,.9);flex:0 0 auto}
  .label.mini{font-size:10.5px;padding:4px 10px 4px 7px;background:rgba(9,22,14,.62);color:rgba(226,255,232,.75)}

  /* 悬停提示 */
  #tip{
    position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:0;
    transform:translate3d(-999px,-999px,0);
    transition:opacity .16s ease;
    max-width:330px;
  }
  #tip .box{
    background:rgba(8,20,13,.9);border:1px solid rgba(180,255,200,.24);
    border-radius:12px;padding:9px 13px 10px;
    box-shadow:0 14px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  #tip .name{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:#d6ffb0;display:block;margin-bottom:3px}
  #tip .desc{font-size:11.5px;line-height:1.55;color:rgba(226,255,232,.66);letter-spacing:.03em}

  /* 载入 */
  #loader{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
    background:radial-gradient(ellipse at 50% 45%,#0a2316 0%,#04100a 60%,#030906 100%);
    transition:opacity .7s ease;color:rgba(200,255,215,.6);font-size:12px;letter-spacing:.32em}
  #loader.hide{opacity:0;pointer-events:none}
  .ld{width:52px;height:52px;border-radius:50%;border:1px solid rgba(150,255,170,.16);position:relative}
  .ld:before{content:"";position:absolute;inset:-1px;border-radius:50%;
    border:1px solid transparent;border-top-color:#9be86f;animation:spin 1.1s linear infinite}
  .ld:after{content:"";position:absolute;inset:12px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#b9ff8a,#2f8a3a 70%);filter:blur(.4px);opacity:.85}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:820px){
    .hud h1{font-size:21px}
    .hud.tr{right:14px;top:14px;padding:8px}
    button{min-width:auto;padding:9px 14px;font-size:12px}
    .hud.tl{left:14px;top:14px;padding:13px 16px}
    .hud.bl{left:14px;bottom:14px;padding:11px 13px;transform:scale(.94);transform-origin:left bottom}
    .hud.bc{display:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="sun"></div>
<div class="rays"></div>
<div class="vig"></div>

<div class="hud tl">
  <div class="eyebrow">光 合 作 用 · 全 过 程</div>
  <h1>叶片的秘密</h1>
  <div class="sub">叶片纵切 · 从蜡质表面一路看到类囊体</div>
</div>

<div class="hud tr">
  <button id="btnExplode"><span class="ico">◈</span><span id="explodeTxt">爆炸视图</span></button>
  <button id="btnReset"><span class="ico">⟲</span><span>复位视角</span></button>
</div>

<div class="hud bl">
  <div class="legend"><span class="d photon"></span><b>光子</b> → 光反应激发叶绿素</div>
  <div class="legend"><span class="d water"></span><b>水</b> 沿木质部上升</div>
  <div class="legend"><span class="d sugar"></span><b>糖</b> 经韧皮部运出</div>
  <div class="legend"><span class="d air"></span><b>氧气</b> 从气孔逸出</div>
  <div class="meter">
    <div class="row"><span>气孔开度</span><span class="bar"><i id="barStoma"></i></span><span id="valStoma">50%</span></div>
    <div class="row"><span>卡尔文循环</span><span style="margin-left:auto" id="valCalvin">1.0 圈/秒</span></div>
    <div class="sunbtn" id="sunToggle"><span class="lamp"></span><span>阳光照射中</span></div>
  </div>
</div>

<div class="hud bc">拖拽环绕 · 滚轮缩放，一路钻进叶绿体</div>

<div id="labels"></div>
<div id="tip"><div class="box"><span class="name"></span><span class="desc"></span></div></div>

<div id="loader"><div class="ld"></div><div>正在组装叶片</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   0. 基础工具
   ============================================================ */
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

let _seed = 20261027;
function rnd() { _seed = (_seed * 16807) % 2147483647; return (_seed - 1) / 2147483646; }
const rr = (a, b) => a + (b - a) * rnd();

/** 给几何体烘焙竖直方向的明暗渐变，让细胞有体积感 */
function shadeByAxis(geo, axis, lo, hi) {
  const pos = geo.attributes.position;
  let min = Infinity, max = -Infinity;
  const idx = axis === 'y' ? 1 : axis === 'x' ? 0 : 2;
  for (let i = 0; i < pos.count; i++) {
    const v = pos.getComponent(i, idx);
    if (v < min) min = v;
    if (v > max) max = v;
  }
  const colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const t = (pos.getComponent(i, idx) - min) / Math.max(1e-6, max - min);
    const k = lo + (hi - lo) * t;
    colors[i * 3] = k; colors[i * 3 + 1] = k; colors[i * 3 + 2] = k;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return geo;
}

/* ============================================================
   1. 渲染器 / 相机 / 控制器
   ============================================================ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.localClippingEnabled = true;
renderer.setClearAlpha(0);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04120b, 0.008);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.02, 200);
const TARGET = new THREE.Vector3(-0.43, 1.24, -0.5);
const CAM_HOME = new THREE.Vector3(3.5, 3.6, 11.3);

camera.position.copy(CAM_HOME).add(TARGET);
camera.lookAt(TARGET);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.rotateSpeed = 0.8;
controls.zoomSpeed = 0.95;
controls.panSpeed = 0.7;
controls.minDistance = 0.8;
controls.maxDistance = 22;
controls.minPolarAngle = 0.16;
controls.maxPolarAngle = Math.PI - 0.16;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;


/* 程序化天穹：深绿渐变 + 太阳方向的光晕 */
function makeSky() {
  const geo = new THREE.SphereGeometry(70, 40, 24);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uSun: { value: new THREE.Vector3(7.5, 9.5, 6.5).normalize() }
    },
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vDir;
      uniform vec3 uSun;
      void main(){
        vec3 d = normalize(vDir);
        float h = clamp(d.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 col = mix(vec3(0.008, 0.028, 0.017), vec3(0.045, 0.135, 0.080), pow(h, 1.4));
        float sun = pow(max(dot(d, uSun), 0.0), 26.0);
        float halo = pow(max(dot(d, uSun), 0.0), 3.2);
        col += vec3(1.0, 0.90, 0.62) * sun * 0.55;
        col += vec3(0.30, 0.52, 0.22) * halo * 0.28;
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  return mesh;
}

/* ============================================================
   2. 灯光 / 环境
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xc8ffd8, 0x0a2a16, 0.42));

const sunLight = new THREE.DirectionalLight(0xfff6d8, 2.7);
sunLight.position.set(7.5, 9.5, 6.5);
scene.add(sunLight);

const rimLight = new THREE.DirectionalLight(0x8dffb8, 1.15);
rimLight.position.set(-8, 3.2, -5);
scene.add(rimLight);

const coolFill = new THREE.DirectionalLight(0x84c4ff, 0.45);
coolFill.position.set(-4, -5, 3.5);
scene.add(coolFill);

// 正面补光：照亮切面内部
const frontFill = new THREE.DirectionalLight(0xdcffe4, 1.35);
frontFill.position.set(1.5, 0.8, 9);
scene.add(frontFill);

// 左侧暖光：勾出层与层的边缘
const edgeWarm = new THREE.DirectionalLight(0xffd9a8, 0.75);
edgeWarm.position.set(-8, 2.5, 5);
scene.add(edgeWarm);

const insideGlow = new THREE.PointLight(0x8cff6a, 0.0, 3.0, 2.0);
insideGlow.position.set(-0.43, 1.3, 0.9);
scene.add(insideGlow);

const veinGlow = new THREE.PointLight(0x63c6ff, 0.7, 4, 2.0);
veinGlow.position.set(-1.2, 0.6, 0.6);
scene.add(veinGlow);

/* ============================================================
   2.5 后期：柔和泛光（让光子、叶绿体发光）
   ============================================================ */
let composer = null, bloomPass = null;
function initComposer() {
  try {
    composer = new EffectComposer(renderer);
    composer.setPixelRatio(Math.min(window.devicePixelRatio, 1.6));
    composer.setSize(window.innerWidth, window.innerHeight);
    composer.addPass(new RenderPass(scene, camera));
    bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight), 0.34, 0.55, 0.9
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());
  } catch (e) {
    composer = null;
  }
}

/* ============================================================
   3. 裁切面（叶片纵切的切面）
   ============================================================ */
const CLIP_Z = -0.15;
const CLIP = new THREE.Plane(new THREE.Vector3(0, 0, -1), CLIP_Z);

/* ============================================================
   4. 部件 / 材质注册（用于高亮与爆炸）
   ============================================================ */
const ACCENT = new THREE.Color(0xc8ff8a);
const FADE_PARTS = new Set(['surface', 'upperEpi', 'spongy', 'lowerEpi', 'vein', 'palisade', 'stoma']);
const groups = {};
const partMats = {};
const pickables = [];
const explodeParts = [];

function partBucket(id) {
  if (!partMats[id]) partMats[id] = { solid: [], line: [], rim: [] };
  return partMats[id];
}

function mkGroup(id, parent = scene) {
  const g = new THREE.Group();
  g.name = id;
  parent.add(g);
  groups[id] = g;
  return g;
}

function tag(obj, part, pick = true) {
  obj.userData.part = part;
  if (pick && obj.isMesh) pickables.push(obj);
  return obj;
}

/** 标准材质（自动登记高亮） */
function std(part, params = {}, opts = {}) {
  const m = new THREE.MeshStandardMaterial(Object.assign({
    roughness: 0.55, metalness: 0.02, envMapIntensity: 0.2
  }, params));
  if (opts.clip !== false) { m.clippingPlanes = [CLIP]; }
  const e = { mat: m, base: (m.emissive || new THREE.Color(0)).clone(), baseEI: m.emissiveIntensity, animated: !!opts.animated, op: m.opacity };
  partBucket(part).solid.push(e);
  return m;
}

/** 玻璃质感材质 */
function phys(part, params = {}, opts = {}) {
  const m = new THREE.MeshPhysicalMaterial(Object.assign({
    roughness: 0.3, metalness: 0.0, envMapIntensity: 0.26
  }, params));
  if (opts.clip !== false) { m.clippingPlanes = [CLIP]; }
  const e = { mat: m, base: (m.emissive || new THREE.Color(0)).clone(), baseEI: m.emissiveIntensity, animated: !!opts.animated, op: m.opacity };
  partBucket(part).solid.push(e);
  return m;
}

/** 线条材质 */
function lineMat(part, params = {}, opts = {}) {
  const m = new THREE.LineBasicMaterial(Object.assign({ transparent: true, opacity: 0.4 }, params));
  if (opts.clip !== false) { m.clippingPlanes = [CLIP]; }
  partBucket(part).line.push({ mat: m, base: m.color.clone(), baseOp: m.opacity });
  return m;
}

/** 边缘光壳（菲涅尔） */
function rimMat(part, color, opacity = 0.5) {
  const m = new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(color) }, uOpacity: { value: opacity } },
    vertexShader: `
      varying vec3 vN; varying vec3 vP;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vN = normalize(normalMatrix * normal);
        vP = mv.xyz;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uOpacity;
      varying vec3 vN; varying vec3 vP;
      void main(){
        float f = 1.0 - abs(dot(normalize(vN), normalize(-vP)));
        f = pow(clamp(f, 0.0, 1.0), 3.1);
        gl_FragColor = vec4(uColor, f * uOpacity);
      }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  });
  partBucket(part).rim.push({ mat: m, base: opacity });
  return m;
}

/* ============================================================
   5. 形体（叶片样本块）
   ============================================================ */
const L = {
  x0: -4.3, x1: 4.3,
  cuticleTop: 2.31,
  upperTop: 2.16, upperBot: 1.80,
  palBot: 0.915, palTop: 1.79,
  spBot: 0.34, spTop: 0.94,
  lowTop: 0.335, lowBot: 0.045,
  zFront: -0.15, zBack: -3.2,
  veinY: 0.86, veinZ: -0.72
};

/* ---------- 5.1 上表面：角质层 + 叶脉网络 ---------- */
const gSurface = mkGroup('surface');

{
  const geo = shadeByAxis(new RoundedBoxGeometry(8.6, 0.15, 3.2, 4, 0.055), 'z', 1.12, 0.68);
  const m = phys('surface', {
    color: 0x3a7d21, roughness: 0.3, metalness: 0.02, vertexColors: true,
    clearcoat: 1.0, clearcoatRoughness: 0.06,
    emissive: 0x0b2209, emissiveIntensity: 0.3
  });

const stomataSurface = [];

  const guardMat = phys('stoma', {

  const guardGeo = new THREE.SphereGeometry(1, 20, 14);

  // 剖面处的两对气孔（正面可见）：两个肾形保卫细胞夹出一个孔
  stomataHoles.forEach(x => {
    const g = new THREE.Group();
    g.position.set(x, 0.19, -0.34);
    const pair = { g, openness: 0.5, guards: [] };

    [-1, 1].forEach(sgn => {
      const mesh = new THREE.Mesh(guardGeo, guardMat);
      mesh.scale.set(0.125, 0.185, 0.135);
      mesh.position.set(sgn * 0.16, 0, 0);
      mesh.rotation.z = sgn * 0.26;
      mesh.rotation.y = sgn * 0.1;
      g.add(tag(mesh, 'stoma'));
      const shell = new THREE.Mesh(guardGeo, guardRim);
      shell.position.copy(mesh.position);
      shell.rotation.copy(mesh.rotation);
      shell.scale.copy(mesh.scale).multiplyScalar(1.04);
      g.add(shell);
      pair.guards.push({ mesh, sgn, shell });
    });

    // 孔道（透镜形）
    const pore = new THREE.Mesh(new THREE.CircleGeometry(1, 22), poreMat);
    pore.scale.set(0.085, 0.17, 1);
    pore.position.set(0, 0, -0.15);

    poreRim.scale.set(0.135, 0.21, 1);
    poreRim.position.set(0, 0, -0.2);
    g.add(poreRim);
    pair.pore = pore;
    pair.poreRim = poreRim;

    gStoma.add(g);
    guardPairs.push(pair);
  });

  // 下表面（背面）真实气孔群：从下方看到的小孔
  const xs = [-3.7, -3.1, -2.45, -1.8, -1.15, -0.5, 0.15, 0.8, 1.45, 2.1, 2.75, 3.4, 4.0];
  const zs = [-0.55, -1.35, -2.15, -2.85];

    const g = new THREE.Group();
    g.position.set(x + rr(-0.12, 0.12), 0.035, z + rr(-0.1, 0.1));
    g.rotation.x = Math.PI / 2;
    const s = rr(0.85, 1.2);
    g.scale.setScalar(s);
    const pair = { g, guards: [], openness: 0.5, surface: true };
    [-1, 1].forEach(sgn => {
      const mesh = new THREE.Mesh(guardGeo, guardMat);
      mesh.scale.set(0.052, 0.088, 0.05);
      mesh.position.x = sgn * 0.062;
      mesh.rotation.z = sgn * 0.22;
      g.add(mesh);
      pair.guards.push({ mesh, sgn });
    });
    const pore = new THREE.Mesh(new THREE.CircleGeometry(1, 16), poreMat);
    pore.scale.set(0.04, 0.085, 1);
    pore.position.z = 0.012;
    g.add(pore);
    pair.pore = pore;
    gStoma.add(g);
    stomataSurface.push(pair);
  }));
}

const gCalvin = mkGroup('calvin', gChloro);
const gETC = mkGroup('etc', gChloro);

const granaStacks = [];
const psNodes = [];
const discMats = [];

{
  /* 被膜：类透镜外形 */
  const envGeo = new THREE.SphereGeometry(1, 40, 26);
  const envMat = phys('chloroplast', {

  /* 内膜 */
  const innerMat = phys('stroma', {

  }, { clip: false });
  [[-0.20, -0.055, 0.03, 0.019], [0.20, 0.055, -0.02, 0.016], [0.03, -0.075, -0.05, 0.014]].forEach(([x, y, z, s]) => {

  });

  /* 基粒：堆叠的类囊体圆盘 */
  const stackSpots = [
    [-0.185, 0.012, 0.012, 0],
    [-0.085, -0.028, 0.030, 0.4],
    [0.012, 0.020, -0.020, 0.8],
    [0.110, -0.018, 0.024, 1.2],
    [0.198, 0.020, -0.010, 1.6]
  ];
  const discGeo = new THREE.CylinderGeometry(0.036, 0.036, 0.0095, 18);

  stackSpots.forEach(([sx, sy, sz, ph], si) => {
    const stack = new THREE.Group();
    stack.position.set(sx, sy, sz);
    stack.rotation.z = rr(-0.12, 0.12);
    stack.rotation.x = rr(-0.16, 0.16);
    const nDisc = 6;
    const mats = [];
    for (let i = 0; i < nDisc; i++) {
      const dmSide = std('grana', {

function makePoints(count, opts = {}) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const size = new Float32Array(count);
  const alpha = new Float32Array(count);
  const col = new Float32Array(count * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));
  geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uScale: { value: window.innerHeight * 0.5 } },
    vertexShader: `
      attribute float aSize; attribute float aAlpha; attribute vec3 aColor;
      varying float vA; varying vec3 vC;
      uniform float uScale;
      void main(){
        vA = aAlpha; vC = aColor;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = clamp(aSize * uScale / max(0.001, -mv.z), 1.0, 26.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying float vA; varying vec3 vC;
      void main(){
        vec2 d = gl_PointCoord - 0.5;
        float r = length(d);
        if(r > 0.5) discard;
        float a = smoothstep(0.5, 0.0, r);
        a = pow(a, 1.7);
        gl_FragColor = vec4(vC, a * vA);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);
  return { pts, geo, pos, size, alpha, col, count, mat, opacity: 1 };
}

function flushPoints(s) {
  s.geo.attributes.position.needsUpdate = true;
  s.geo.attributes.aSize.needsUpdate = true;
  s.geo.attributes.aAlpha.needsUpdate = true;
  s.geo.attributes.aColor.needsUpdate = true;
}

/* ---------- 7.1 光子 ---------- */
const N_PHOTON = 110;
const photons = makePoints(N_PHOTON);
const photonState = [];
for (let i = 0; i < N_PHOTON; i++) {
  photonState.push({ p: new THREE.Vector3(), v: new THREE.Vector3(), size: 0, alpha: 0 });
  resetPhoton(photonState[i], true);
  photons.col[i * 3] = 1.0; photons.col[i * 3 + 1] = 0.93; photons.col[i * 3 + 2] = 0.62;
}
function resetPhoton(s, randomY) {
  s.p.set(rr(-6.5, 6.0), randomY ? rr(2.4, 8.0) : rr(6.0, 8.4), rr(-4.5, 2.6));
  s.v.set(rr(-0.22, -0.08), -1, rr(0.06, 0.24)).normalize().multiplyScalar(rr(2.4, 3.6));
  s.size = rr(0.055, 0.125);
}
function updatePhotons(dt) {
  for (let i = 0; i < N_PHOTON; i++) {
    const s = photonState[i];
    s.p.addScaledVector(s.v, dt * (sunOn ? 1 : 0.0));
    // 接近叶面时变亮，穿过后消失
    const nearSurface = 2.31;
    let a = 1;
    if (s.p.y < nearSurface + 1.2) a = clamp01((s.p.y - nearSurface) / 1.2) * 0.95;
    if (s.p.y < nearSurface + 0.02 && !s.hit) {
      s.hit = true;
      if (sunOn && s.p.y > nearSurface - 0.4) emitSpark(s.p);
    }
    if (s.p.y < nearSurface - 0.05 || s.p.y < 0) { s.hit = false; resetPhoton(s, false); }
    photons.pos[i * 3] = s.p.x;
    photons.pos[i * 3 + 1] = s.p.y;
    photons.pos[i * 3 + 2] = s.p.z;
    photons.size[i] = s.size * (sunOn ? 1 : 0.2);
    photons.alpha[i] = a;
  }
  flushPoints(photons);
}

/* ---------- 7.15 光子击中叶面的闪光 ---------- */
const N_SPARK = 24;
const sparks = makePoints(N_SPARK);
const sparkState = [];
for (let i = 0; i < N_SPARK; i++) {
  sparkState.push({ life: 1, p: new THREE.Vector3() });
  sparks.col[i * 3] = 1.0; sparks.col[i * 3 + 1] = 0.98; sparks.col[i * 3 + 2] = 0.7;
  sparks.alpha[i] = 0;
}
let sparkPtr = 0;
function emitSpark(p) {
  const s = sparkState[sparkPtr];
  s.life = 0;
  s.p.copy(p);
  sparkPtr = (sparkPtr + 1) % N_SPARK;
}
function updateSparks(dt) {
  for (let i = 0; i < N_SPARK; i++) {
    const s = sparkState[i];
    s.life = Math.min(1, s.life + dt * 2.6);
    const k = 1 - s.life;
    sparks.pos[i * 3] = s.p.x;
    sparks.pos[i * 3 + 1] = s.p.y;
    sparks.pos[i * 3 + 2] = s.p.z;
    sparks.size[i] = 0.10 * (0.3 + k);
    sparks.alpha[i] = Math.pow(k, 1.4) * 0.9;
  }
  flushPoints(sparks);
}

/* ---------- 7.2 水（木质部） ---------- */
const N_WATER = 90;
const waters = makePoints(N_WATER);
const waterState = [];
for (let i = 0; i < N_WATER; i++) {
  waterState.push({ u: rnd(), tube: 0, rise: false, p: new THREE.Vector3(), size: 0, alpha: 0, seed: rnd() });
  const s = waterState[i];
  s.rise = rnd() < 0.35;
  s.tube = Math.floor(rnd() * xylemTubes.length);
  waters.col[i * 3] = 0.42; waters.col[i * 3 + 1] = 0.76; waters.col[i * 3 + 2] = 1.0;
}
function updateWaters(dt, t) {
  for (let i = 0; i < N_WATER; i++) {
    const s = waterState[i];
    s.u += dt * (s.rise ? 0.28 : 0.13) * (sunOn ? 1 : 0.25);
    if (s.u > 1) { s.u = 0; s.rise = rnd() < 0.35; s.tube = Math.floor(rnd() * xylemTubes.length); }
    if (!s.rise) {
      // 沿木质部长距离上升（x 方向）
      const tube = xylemTubes[s.tube];
      s.p.set(-4.3 + 8.6 * s.u, tube.y + Math.sin(t * 2 + s.seed * 9) * 0.012, tube.z + Math.sin(t * 1.4 + s.seed * 5) * 0.012);
      s.alpha = Math.sin(s.u * Math.PI) * 0.95;
    } else {
      // 从叶脉分支向上进入叶肉
      const x = -4.3 + 8.6 * s.u;
      s.p.set(x, 0.95 + Math.sin(s.u * Math.PI) * 1.05, L.veinZ + Math.sin(t + s.seed * 7) * 0.08);
      s.alpha = Math.sin(s.u * Math.PI) * 0.55;
    }
    s.size = 0.055;
    waters.pos[i * 3] = s.p.x; waters.pos[i * 3 + 1] = s.p.y; waters.pos[i * 3 + 2] = s.p.z;
    waters.size[i] = s.size; waters.alpha[i] = s.alpha;
  }
  flushPoints(waters);
}

    sugars.pos[i * 3] = x;
    sugars.pos[i * 3 + 1] = tube.y + Math.sin(t * 2.2 + s.seed * 8) * 0.014;
    sugars.pos[i * 3 + 2] = tube.z + Math.cos(t * 1.8 + s.seed * 4) * 0.014;
    sugars.size[i] = 0.052;
    sugars.alpha[i] = Math.sin(s.u * Math.PI) * 0.95;

  co2.col[i * 3] = 0.78; co2.col[i * 3 + 1] = 0.86; co2.col[i * 3 + 2] = 0.95;

    const y = -0.55 + s.u * 1.75;
    // 靠近气孔时被“吸”进去
    const pinch = Math.min(1, s.u * 6);
    co2.pos[i * 3] = s.x + Math.sin(t * 1.3 + s.seed * 9) * 0.12 * pinch;
    co2.pos[i * 3 + 1] = y;
    co2.pos[i * 3 + 2] = -0.34 + Math.sin(t * 0.9 + s.seed * 6) * 0.22 * pinch;
    co2.size[i] = 0.05;
    co2.alpha[i] = Math.sin(s.u * Math.PI) * 0.6;

/* ---------- 7.5 氧气泡（逸出） ---------- */
const N_O2 = 26;
const o2Geo = new THREE.SphereGeometry(1, 10, 8);
const o2Mat = new THREE.MeshBasicMaterial({
  color: 0xbdf8ff, transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const o2Mesh = new THREE.InstancedMesh(o2Geo, o2Mat, N_O2);
o2Mesh.frustumCulled = false;
o2Mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N_O2 * 3), 3);
scene.add(o2Mesh);
const o2State = [];
for (let i = 0; i < N_O2; i++) {
  o2State.push({
    t: rnd(), seed: rnd(), side: rnd() < 0.5 ? -1 : 1,
    from: new THREE.Vector3(), dur: rr(3.4, 5.2)
  });
}
const _dummy = new THREE.Object3D();
const _c = new THREE.Color();
function updateO2(dt, t) {
  for (let i = 0; i < N_O2; i++) {
    const s = o2State[i];
    s.t += dt / s.dur * (sunOn ? 1 : 0.05);
    if (s.t >= 1) {
      s.t = 0;
      s.side = rnd() < 0.5 ? -1 : 1;
      s.from.set(CH_POS.x + rr(-0.18, 0.18), CH_POS.y + rr(-0.12, 0.14), CH_POS.z + rr(-0.1, 0.1));
      s.dur = rr(3.4, 5.4);
    }
    const toStoma = 0.55;
    let p;
    if (s.t < toStoma) {
      const k = easeInOut(s.t / toStoma);
      const sx = s.side < 0 ? stomataHoles[0] : stomataHoles[1];
      p = new THREE.Vector3(
        lerp(s.from.x, sx, k),
        lerp(s.from.y, 0.20, k) - Math.sin(k * Math.PI) * 0.12,
        lerp(s.from.z, -0.34, k)
      );
    } else {
      const k = (s.t - toStoma) / (1 - toStoma);
      const sx = s.side < 0 ? stomataHoles[0] : stomataHoles[1];
      p = new THREE.Vector3(
        sx + Math.sin(k * 6 + s.seed * 9) * 0.06 * k,
        0.20 - k * 1.05,
        -0.34 + Math.cos(k * 5 + s.seed * 8) * 0.07
      );
    }
    const grow = s.t < toStoma ? 0.007 + s.t * 0.013 : 0.020 + (s.t - toStoma) * 0.008;
    _dummy.position.copy(p);
    _dummy.scale.setScalar(grow);
    _dummy.updateMatrix();
    o2Mesh.setMatrixAt(i, _dummy.matrix);
    const fade = s.t < 0.1 ? s.t / 0.1 : (s.t > 0.82 ? clamp01((1 - s.t) / 0.18) : 1);
    _c.setRGB(0.62 * fade, 0.94 * fade, 1.0 * fade);
    o2Mesh.setColorAt(i, _c);
  }
  o2Mesh.instanceMatrix.needsUpdate = true;
  if (o2Mesh.instanceColor) o2Mesh.instanceColor.needsUpdate = true;
}

    const y = (-_wv.y * 0.5 + 0.5) * window.innerHeight;
    const leftSide = p.anchor[0] < 0;
    el.style.transform = `translate3d(${x}px, ${y}px, 0) translate(${leftSide ? 'calc(-100% - 14px)' : '14px'}, -50%)`;
    const near = p.mini ? clamp01((3.2 - camDist) / 1.0) : 1;
    el.style.opacity = (0.25 + explodeAmt * 0.75) * near;
  });
}

/* ============================================================
   9. 交互：悬停 / 爆炸 / 阳光
   ============================================================ */
let hoveredPart = null;
const hoverAmt = {};
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-10, -10);
let pointerActive = false;

const tipEl = document.getElementById('tip');
const tipName = tipEl.querySelector('.name');
const tipDesc = tipEl.querySelector('.desc');
let tipX = 0, tipY = 0;

function setHover(id) {
  if (hoveredPart === id) return;
  hoveredPart = id;
  if (id) {
    const p = PARTS.find(x => x.id === id);
    if (p) {
      tipName.textContent = p.name;
      tipDesc.textContent = p.desc;
      tipEl.style.opacity = 1;
    }
  } else {
    tipEl.style.opacity = 0;
  }
}

canvas.addEventListener('pointermove', e => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  pointerActive = true;
  tipX = e.clientX; tipY = e.clientY;
  tipEl.style.transform = `translate3d(${Math.min(tipX + 18, window.innerWidth - 350)}px, ${tipY + 20}px, 0)`;
});
canvas.addEventListener('pointerleave', () => { pointerActive = false; setHover(null); });

let dragging = false;
canvas.addEventListener('pointerdown', () => { dragging = true; });
window.addEventListener('pointerup', () => { dragging = false; });

function pick() {
  if (!pointerActive || dragging) { setHover(null); return; }
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  // 钻进叶绿体后，忽略包裹在外的叶片层，优先响应内部结构
  const near = camera.position.distanceTo(controls.target) < 2.3;
  let id = null;
  for (const h of hits) {
    const pt = h.object.userData.part;
    if (!pt) continue;
    if (near && (pt === 'palisade' || pt === 'spongy' || pt === 'upperEpi' || pt === 'lowerEpi')) continue;
    id = pt; break;
  }
  setHover(id);
}

/* 爆炸 */
let explodeTarget = 0, explodeAmt = 0;
const btnExplode = document.getElementById('btnExplode');
const explodeTxt = document.getElementById('explodeTxt');
btnExplode.addEventListener('click', () => {
  explodeTarget = explodeTarget > 0.5 ? 0 : 1;
  const on = explodeTarget > 0.5;
  btnExplode.classList.toggle('on', on);
  explodeTxt.textContent = on ? '合拢复位' : '爆炸视图';
  if (on) { controls.autoRotate = false; }
  // 展开时相机略微后退，保证所有层都在画面里
  const dir = camera.position.clone().sub(controls.target).normalize();
  const d = camera.position.distanceTo(controls.target);
  const nd = on ? Math.max(d, 11) * 1.14 : Math.max(d / 1.14, 8.5);
  camTween = {
    t: 0, fromP: camera.position.clone(), toP: controls.target.clone().addScaledVector(dir, nd),
    fromT: controls.target.clone(), toT: controls.target.clone()
  };
});

/* 复位视角 */
const btnReset = document.getElementById('btnReset');
let camTween = null;
btnReset.addEventListener('click', () => {
  camTween = { t: 0, fromP: camera.position.clone(), toP: CAM_HOME.clone().add(TARGET), fromT: controls.target.clone(), toT: TARGET.clone() };
});

/* 阳光 */
let sunOn = true;
const sunToggle = document.getElementById('sunToggle');
sunToggle.addEventListener('click', () => {
  sunOn = !sunOn;
  sunToggle.classList.toggle('off', !sunOn);
  sunToggle.querySelector('span:last-child').textContent = sunOn ? '阳光照射中' : '暗处 · 反应暂停';
  sunLight.intensity = sunOn ? 2.7 : 0.45;
  rimLight.intensity = sunOn ? 1.15 : 0.35;
  insideGlow.intensity = sunOn ? 0.45 : 0.1;
  veinGlow.intensity = sunOn ? 0.7 : 0.2;
  renderer.toneMappingExposure = sunOn ? 0.92 : 0.6;
});

/* ============================================================
   10. 动画
   ============================================================ */
const barStoma = document.getElementById('barStoma');
const valStoma = document.getElementById('valStoma');
const clock = new THREE.Clock();
let T = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  T += dt;

  /* 爆炸缓动 */
  explodeAmt += (explodeTarget - explodeAmt) * Math.min(1, dt * 4.2);
  if (Math.abs(explodeTarget - explodeAmt) < 0.002) explodeAmt = explodeTarget;
  const e = easeInOut(explodeAmt);
  explodeParts.forEach(p => {
    p.group.position.copy(p.group.userData.base).addScaledVector(p.group.userData.offset, e);
  });
  // 叶绿体作为"细节标本"在展开时放大
  const cs = 1 + e * 0.55;
  gChloro.scale.setScalar(cs);

  /* 越靠近叶绿体，外层组织越透明，让内部结构看得清 */
  const camDist = camera.position.distanceTo(controls.target);
  const focus = clamp01((camDist - 1.5) / 3.6);
  const fadeK = 0.02 + 0.98 * focus;

  /* 悬停高亮 */
  PARTS.forEach(p => {
    const target = hoveredPart === p.id ? 1 : 0;
    const cur = hoverAmt[p.id] || 0;
    const next = cur + (target - cur) * Math.min(1, dt * 12);
    hoverAmt[p.id] = next;
    const b = partMats[p.id];
    if (!b) return;
    const fk = FADE_PARTS.has(p.id) ? fadeK : 1;
    b.solid.forEach(it => {
      if (!it.animated) it.mat.emissive.copy(it.base);
      if (next > 0.002) it.mat.emissive.lerp(ACCENT, next * 0.42);
      if (!it.animated) it.mat.emissiveIntensity = it.baseEI + next * 0.4;
      if (it.mat.transparent) it.mat.opacity = it.op * fk;
    });
    b.line.forEach(it => {
      it.mat.color.copy(it.base);
      if (next > 0.002) it.mat.color.lerp(ACCENT, next * 0.85);
      it.mat.opacity = (it.baseOp + next * 0.5) * fk;
    });
    const exBoost = (p.id === 'chloroplast' || p.id === 'grana') ? (1 + easeInOut(explodeAmt) * 1.2) : 1;
    b.rim.forEach(it => {
      it.mat.uniforms.uOpacity.value = (it.base + next * 0.55) * fk * exBoost;
    });
  });

  /* 气孔开合 */
  const breath = 0.5 + 0.5 * Math.sin(T * 0.85 - 1.2);      // 0..1
  const openness = 0.18 + 0.82 * breath;
  const stomaLabel = Math.round(openness * 100);
  barStoma.style.width = stomaLabel + '%';
  valStoma.textContent = stomaLabel + '%';

  guardPairs.forEach(pair => {
    pair.guards.forEach(g => {
      const push = 0.152 + 0.03 * openness;
      g.mesh.position.x = g.sgn * push;
      g.mesh.scale.set(0.125 * (0.84 + 0.26 * openness), 0.185 * (0.95 + 0.09 * openness), 0.135);
      if (g.shell) {
        g.shell.position.x = g.mesh.position.x;
        g.shell.scale.copy(g.mesh.scale).multiplyScalar(1.04);
      }
    });
    if (pair.pore) {
      pair.pore.scale.set(0.085 * (0.30 + 1.35 * openness), 0.17 * (0.82 + 0.32 * openness), 1);
    }
    if (pair.poreRim) {
      pair.poreRim.scale.set(0.135 * (0.62 + 0.62 * openness), 0.21 * (0.86 + 0.26 * openness), 1);
      pair.poreRim.material.opacity = 0.06 + 0.2 * openness;
    }
  });
  // 背面气孔同步
  stomataSurface.forEach(pair => {
    pair.guards.forEach(g => {
      g.mesh.position.x = g.sgn * (0.055 + 0.013 * openness);
      g.mesh.scale.set(0.052 * (0.86 + 0.24 * openness), 0.088, 0.05);
    });
    if (pair.pore) pair.pore.scale.set(0.04 * (0.42 + 0.95 * openness), 0.085, 1);
  });

  /* 光反应：类囊体闪烁 + 光系统脉冲（越近越亮，像暗场里的荧光） */
  const zoomK = 1 + (1 - focus) * 1.5;
  const lightK = (sunOn ? 1 : 0.04) * zoomK;
  discMats.forEach((m, i) => {
    const f = 0.05 + 0.30 * lightK * (0.5 + 0.5 * Math.sin(T * 3.1 + i * 0.9)) + 0.30 * lightK * Math.pow(Math.max(0, Math.sin(T * 1.7 + i * 0.37)), 8);
    m.emissiveIntensity = f;
  });
  psNodes.forEach((p, i) => {
    const pulse = 0.35 + 1.5 * lightK * Math.pow(Math.max(0, Math.sin(T * 2.4 + p.ph)), 6);
    p.mat.emissiveIntensity = pulse;
    p.mesh.scale.setScalar(0.85 + 0.5 * lightK * Math.pow(Math.max(0, Math.sin(T * 2.4 + p.ph)), 6));
  });

  /* 卡尔文循环：约每秒一圈 */
  if (gCalvin.userData.ring) {
    gCalvin.userData.ring.rotation.z += dt * Math.PI * 2 * (sunOn ? 1.0 : 0.06);
  }

  /* 粒子 */
  updatePhotons(dt);
  updateSparks(dt);
  updateWaters(dt, T);
  updateSugars(dt, T);
  updateCO2(dt, T);
  updateO2(dt, T);
  updateElectrons(dt);

  /* 呼吸灯：叶脉与叶绿体 */
  insideGlow.intensity = (sunOn ? 0.5 : 0.12) + Math.sin(T * 2.2) * 0.08;

  /* 相机复位动画 */
  if (camTween) {
    camTween.t += dt / 0.95;
    const k = easeInOut(clamp01(camTween.t));
    camera.position.lerpVectors(camTween.fromP, camTween.toP, k);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, k);
    if (camTween.t >= 1) camTween = null;
  }

  pick();
  updateLabels();
  controls.update();
  if (composer) composer.render(); else renderer.render(scene, camera);
}

/* ============================================================
   11. 启动
   ============================================================ */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (composer) composer.setSize(window.innerWidth, window.innerHeight);
  [photons, waters, sugars, co2, elecs, sparks].forEach(s => s.mat.uniforms.uScale.value = window.innerHeight * 0.5);
}
window.addEventListener('resize', onResize);

(async () => {
  try {
    const mod = await import('three/addons/environments/RoomEnvironment.js');
    const pmrem = new THREE.PMREMGenerator(renderer);
    const env = pmrem.fromScene(new mod.RoomEnvironment(), 0.04);
    scene.environment = env.texture;
    pmrem.dispose();
  } catch (err) { /* 环境贴图不可用时退化为纯灯光 */ }

  scene.add(makeSky());
  initComposer();
  window.__leaf = { camera, controls, scene, THREE, composer, skipTween: () => { camTween = null; } };
  animate();
  const loader = document.getElementById('loader');
  setTimeout(() => { loader.classList.add('hide'); setTimeout(() => loader.remove(), 900); }, 260);
})();
</script>
