<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>可交互 3D 单反相机 · 光路与机械结构</title>
<style>
  :root{
    --ink:#eef4fb;
    --dim:rgba(200,220,240,.55);
    --faint:rgba(170,200,230,.38);
    --line:rgba(150,190,230,.15);
    --panel:rgba(12,16,22,.66);
    --accent:#8fd8ff;
    --accent-dim:rgba(143,216,255,.16);
    --warm:#f0b478;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04060a}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(115% 80% at 54% 8%, #24303c 0%, #10161d 40%, #070a0f 76%, #04060a 100%);
  }
  #scene{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #scene:active{cursor:grabbing}

  .hud{
    position:fixed;z-index:20;
    background:linear-gradient(180deg,rgba(18,23,30,.74),rgba(9,12,17,.62));
    -webkit-backdrop-filter:blur(18px) saturate(135%);
    backdrop-filter:blur(18px) saturate(135%);
    border:1px solid var(--line);
    border-radius:15px;
    box-shadow:0 24px 64px rgba(0,0,0,.58), inset 0 1px 0 rgba(255,255,255,.055);
  }

  /* 标题 */
  .tl{left:26px;top:24px;padding:16px 20px 17px;max-width:300px}
  .eyebrow{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:9px;letter-spacing:.36em;color:rgba(150,195,230,.62);text-transform:uppercase;
  }
  h1{font-size:19px;font-weight:600;letter-spacing:.01em;margin:8px 0 7px;line-height:1.3}
  h1 span{color:rgba(185,212,238,.5);font-weight:400}
  .sub{font-size:11.5px;line-height:1.65;color:var(--dim);max-width:258px}
  .sub em{font-style:normal;color:rgba(210,235,255,.82)}

  /* 读数 */
  .tr{right:26px;top:24px;padding:13px 16px 12px;min-width:172px}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:3px 0}
  .row span{font-size:10px;letter-spacing:.08em;color:var(--faint)}
  .row b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:500;color:#e6f2ff}
  .phase{
    margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
    font-size:10.5px;letter-spacing:.06em;color:var(--accent);
    display:flex;align-items:center;gap:7px;
  }
  .phase i{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:bl 1.6s infinite}
  @keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}

  /* 控制 */
  .bl{left:26px;bottom:24px;padding:14px 16px 15px;width:302px}
  .btns{display:flex;gap:7px;flex-wrap:wrap}
  .btn{
    appearance:none;border:1px solid rgba(150,190,230,.18);background:rgba(255,255,255,.035);
    color:rgba(220,236,250,.82);font-size:11px;letter-spacing:.05em;
    padding:7px 11px;border-radius:8px;cursor:pointer;font-family:inherit;
    transition:background .18s,border-color .18s,color .18s,box-shadow .18s;
  }
  .btn:hover{background:rgba(143,216,255,.11);border-color:rgba(143,216,255,.4);color:#eaf7ff}
  .btn.on{
    background:var(--accent-dim);border-color:rgba(143,216,255,.5);color:#d6f2ff;
    box-shadow:inset 0 0 18px rgba(143,216,255,.12),0 0 14px rgba(143,216,255,.08);
  }
  .btn.primary{background:rgba(255,255,255,.06)}
  .btn.primary.on{background:rgba(143,216,255,.18);border-color:rgba(143,216,255,.6);color:#ecfaff}
  .ctrl{margin-top:13px}
  .ctrl label{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:.1em;color:var(--faint);margin-bottom:7px}
  .ctrl label b{font-family:ui-monospace,monospace;font-size:11.5px;font-weight:500;color:#dceeff;letter-spacing:0}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:3px;
    background:linear-gradient(90deg,rgba(143,216,255,.55),rgba(143,216,255,.12));outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#dff4ff;border:1px solid rgba(143,216,255,.9);
    box-shadow:0 0 10px rgba(143,216,255,.6);cursor:grab;
  }
  input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;background:#dff4ff;border:1px solid rgba(143,216,255,.9);
    box-shadow:0 0 10px rgba(143,216,255,.6);
  }
  .ticks{display:flex;justify-content:space-between;margin-top:5px;font-family:ui-monospace,monospace;font-size:8.5px;color:rgba(160,195,225,.34)}
  .bl .btns:last-child{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}

  /* 悬停说明 */
  .br{right:26px;bottom:24px;padding:14px 18px 15px;width:308px}
  .hk{font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.3em;color:rgba(150,195,230,.5)}
  .hn{font-size:14px;font-weight:600;margin:7px 0 6px;color:#f0f7ff;letter-spacing:.02em}
  .hd{font-size:11px;line-height:1.72;color:rgba(198,218,238,.6);min-height:38px}

  /* 标签 */
  #labels{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}
  .lab{
    position:absolute;left:0;top:0;opacity:0;
    font-size:10.5px;letter-spacing:.08em;color:rgba(226,240,252,.9);
    background:rgba(8,12,18,.72);
    border:1px solid rgba(143,216,255,.26);
    border-radius:20px;padding:3px 9px 3px 8px;
    white-space:nowrap;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    box-shadow:0 6px 18px rgba(0,0,0,.45);
    transition:opacity .25s,color .2s,border-color .2s;
  }
  .lab::before{
    content:"";position:absolute;left:-3px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;
    background:rgba(143,216,255,.85);box-shadow:0 0 6px rgba(143,216,255,.8);
  }
  .lab.hot{color:#fff;border-color:rgba(143,216,255,.85);background:rgba(24,58,84,.9)}

  @media (max-width:1080px){
    .tl{max-width:230px}
    .bl{width:262px}
    .br{width:236px}
    .br .hd{min-height:30px}
  }
  @media (max-width:760px){
    .tl{left:12px;top:12px;padding:12px 14px;max-width:200px}
    h1{font-size:15px}
    .sub{font-size:10px;max-width:176px}
    .tr{right:12px;top:12px;min-width:126px;padding:10px 12px}
    .bl{left:12px;right:12px;bottom:12px;width:auto;padding:11px 13px}
    .br{bottom:auto;top:92px;right:12px;width:172px;padding:10px 12px}
    .br .hd{font-size:10px}
    .lab{font-size:9px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<div class="hud tl">
  <div class="eyebrow">光 学 剖 析 · 01</div>
  <h1>单反相机 <span>内部构造</span></h1>
  <p class="sub">光从最前一片镜片进入，被<em>反光镜</em>折向上方，穿过对焦屏与五棱镜，从目镜进入你的眼睛。按下快门，它会改道落在传感器上。</p>
</div>

<div class="hud tr">
  <div class="row"><span>光圈</span><b id="roF">f/2.8</b></div>
  <div class="row"><span>快门</span><b>1/125 s</b></div>
  <div class="row"><span>已拍摄</span><b id="roN">0</b></div>
  <div class="phase"><i></i><span id="roPhase">待机</span></div>
</div>

<div class="hud bl">
  <div class="btns">
    <button class="btn primary" id="btnExplode">爆炸视图</button>
    <button class="btn on" id="btnXray">透视机身</button>
    <button class="btn on" id="btnBeam">显示光路</button>
  </div>
  <div class="ctrl">
    <label>光圈环 <b id="lbF">f/2.8</b></label>
    <input id="fstop" type="range" min="0" max="7" step="1" value="2" />
    <div class="ticks"><span>1.8</span><span>4</span><span>8</span><span>16</span></div>
  </div>
  <div class="ctrl">
    <label>对焦距离 <b id="lbD">0.90 m</b></label>
    <input id="focus" type="range" min="0" max="100" step="1" value="42" />
    <div class="ticks"><span>0.45</span><span>∞</span></div>
  </div>
  <div class="btns">
    <button class="btn on" id="btnShoot">自动连拍</button>
    <button class="btn" id="btnFire">立即释放</button>
    <button class="btn" id="btnReset">复位视角</button>
  </div>
</div>

<div class="hud br">
  <div class="hk">悬 停 查 看</div>
  <div class="hn" id="hName">整个相机</div>
  <div class="hd" id="hDesc">把指针移到任意部件上，看它在光路里的位置与作用。拖拽可环绕观察，滚轮可一路推进镜头内部。</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════════ 渲染基础 ═══════════════ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.34;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.05, 400);
const HOME = new THREE.Vector3(-18.5, 8.6, 24.5);
camera.position.copy(HOME);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.1, 0.6);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.78;
controls.zoomSpeed = 0.95;
controls.minDistance = 1.1;
controls.maxDistance = 78;
controls.maxPolarAngle = Math.PI * 0.92;

/* ═══════════════ 环境光照（程序化，不用任何图片） ═══════════════ */
function buildEnv() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0.00, '#55606e');
  g.addColorStop(0.40, '#1b232c');
  g.addColorStop(0.56, '#090d13');
  g.addColorStop(1.00, '#232b36');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 512);

  const blob = (x, y, rx, ry, a) => {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
    rg.addColorStop(0, `rgba(255,255,255,${a})`);
    rg.addColorStop(0.35, `rgba(226,240,255,${a * 0.5})`);
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.save();
    ctx.translate(x, y); ctx.scale(1, ry / rx); ctx.translate(-x, -y);
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x, y, rx, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };
  blob(230, 130, 250, 95, 1.0);
  blob(760, 105, 160, 66, 0.72);
  blob(520, 300, 330, 48, 0.20);
  blob(70, 360, 130, 42, 0.30);
  blob(980, 330, 120, 40, 0.26);

  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose();
  tex.dispose();
  return env;
}
scene.environment = buildEnv();

const keyLight = new THREE.DirectionalLight(0xffffff, 3.4);
keyLight.position.set(15, 19, 17);
const fillLight = new THREE.DirectionalLight(0xa6c8ff, 1.6);
fillLight.position.set(-19, 6, -9);
const rimLight = new THREE.DirectionalLight(0xffcd94, 2.4);
rimLight.position.set(-5, 11, -22);
const rimLight2 = new THREE.DirectionalLight(0x86c8ff, 1.5);
rimLight2.position.set(12, 4, -20);
const underLight = new THREE.DirectionalLight(0x6b95cf, 0.7);
underLight.position.set(7, -15, 9);
const frontFill = new THREE.DirectionalLight(0xdfeaff, 1.0);
frontFill.position.set(-6, 2, 26);
const leftFill = new THREE.DirectionalLight(0xdfeaff, 1.8);
leftFill.position.set(-18, 12, 16);
scene.add(leftFill);
scene.add(keyLight, fillLight, rimLight, rimLight2, underLight, frontFill,
  new THREE.HemisphereLight(0x9db9dc, 0x04060a, 0.55));

const exposureLight = new THREE.PointLight(0x86e4ff, 0, 9, 2);
exposureLight.position.set(0, 0.8, -2.6);
scene.add(exposureLight);

// 机身内部补光，让透视状态下的机构看得见
const innerLight = new THREE.PointLight(0xcfe4ff, 30, 22, 2);
innerLight.position.set(-1.2, 1.6, -1.4);
scene.add(innerLight);
const innerLight2 = new THREE.PointLight(0xffd9b0, 12, 16, 2);
innerLight2.position.set(-2.5, -1.5, -1.5);
scene.add(innerLight2);

/* ═══════════════ 材质工厂 ═══════════════ */
renderer.localClippingEnabled = true;
const cutPlane = new THREE.Plane(new THREE.Vector3(-0.621, -0.351, -0.701), 3.15);
const xrayMats = [];   // 受“透视机身”影响的外壳材质
const cutMats = [];    // 需要剖切的外壳材质
const rimMeshes = [];  // 外壳的边缘光

function xrayMat(params, baseOpacity) {
  const m = new THREE.MeshPhysicalMaterial(Object.assign({
    color: 0x3b424c, metalness: 0.9, roughness: 0.4,
    clearcoat: 0.35, clearcoatRoughness: 0.5, envMapIntensity: 1.2
  }, params, { transparent: true, opacity: 1, depthWrite: true }));
  m.userData.baseOpacity = baseOpacity;
  cutMats.push(m);
  xrayMats.push(m);
  return m;
}
function solidMat(params) {
  return new THREE.MeshPhysicalMaterial(Object.assign({
    color: 0x2b3038, metalness: 0.85, roughness: 0.45, envMapIntensity: 1.1
  }, params));
}
// 菲涅尔边缘光：让半透明外壳有清晰的玻璃轮廓
function rimMaterial(color, strength) {
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(color) }, uStrength: { value: strength } },
    vertexShader: `
      varying vec3 vN; varying vec3 vE;
      void main(){
        vN = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vE = -mv.xyz;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vN; varying vec3 vE;
      uniform vec3 uColor; uniform float uStrength;
      void main(){
        float f = pow(1.0 - abs(dot(normalize(vN), normalize(vE))), 3.8);
        gl_FragColor = vec4(uColor, f * uStrength);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.FrontSide
  });
}
function addRim(parent, geo, pos, color, strength, scale) {
  const m = new THREE.Mesh(geo, rimMaterial(color, strength));
  m.position.copy(pos);
  m.scale.setScalar(scale || 1.005);
  m.userData.isRim = true;
  parent.add(m);
  rimMeshes.push(m);
  return m;
}
function glassMat(tint, opacity, iridescence) {
  return new THREE.MeshPhysicalMaterial({
    color: tint, metalness: 0, roughness: 0.18,
    transparent: true, opacity: opacity, depthWrite: false,
    ior: 1.55, clearcoat: 0.9, clearcoatRoughness: 0.06,
    iridescence: iridescence || 0, iridescenceIOR: 1.35,
    envMapIntensity: 0.85, side: THREE.DoubleSide
  });
}

const M = {
  chrome: () => solidMat({ color: 0xc2c9d3, metalness: 1, roughness: 0.17, envMapIntensity: 1.5 }),
  darkChrome: () => solidMat({ color: 0x6b7480, metalness: 1, roughness: 0.28 }),
  black: () => solidMat({ color: 0x181b20, metalness: 0.55, roughness: 0.62 }),
  rubber: () => new THREE.MeshPhysicalMaterial({
    color: 0x0f1115, metalness: 0.05, roughness: 0.94,
    clearcoat: 0.12, clearcoatRoughness: 0.85, envMapIntensity: 0.55
  }),
  blade: () => solidMat({ color: 0x2a2f37, metalness: 0.92, roughness: 0.34 }),
  screen: () => new THREE.MeshPhysicalMaterial({
    color: 0xeaf4ff, metalness: 0, roughness: 0.8,
    transparent: true, opacity: 0.8, emissive: 0x54708c, emissiveIntensity: 1.5,
    side: THREE.DoubleSide
  })
};

/* ═══════════════ 几何工具 ═══════════════ */
function roundBoxGeo(w, h, d, r) {
  r = Math.max(0.02, Math.min(r, Math.min(w, h) / 2 - 0.02));
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: d, bevelEnabled: true,
    bevelSize: Math.min(0.07, r * 0.35),
    bevelThickness: Math.min(0.07, d * 0.18),
    bevelSegments: 4, curveSegments: 20
  });
  g.translate(0, 0, -d / 2);
  return g;
}
function cylZ(rTop, rBot, h, seg = 56, open = false) {
  const g = new THREE.CylinderGeometry(rTop, rBot, h, seg, 1, open);
  g.rotateX(Math.PI / 2);
  return g;
}
function ringZ(rIn, rOut, seg = 96) {
  return new THREE.RingGeometry(rIn, rOut, seg);
}
// 从 (z,y) 截面沿 X 挤出
function extrudeZY(points, width, bevel = 0.05) {
  const s = new THREE.Shape();
  points.forEach(([z, y], i) => { i ? s.lineTo(-z, y) : s.moveTo(-z, y); });
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, {
    depth: width, bevelEnabled: true, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 1
  });
  g.translate(0, 0, -width / 2);
  g.rotateY(Math.PI / 2);
  return g;
}
// 镜片：绕轴（Z）的旋转体
function lensGeo(R, t, sagF, sagB, segs = 64) {
  const pts = [];
  const N = 20;
  for (let i = 0; i <= N; i++) {
    const r = R * i / N;
    pts.push(new THREE.Vector2(Math.max(0.001, r), t / 2 - sagF * (r / R) ** 2));
  }
  for (let i = N; i >= 0; i--) {
    const r = R * i / N;
    pts.push(new THREE.Vector2(Math.max(0.001, r), -t / 2 - sagB * (r / R) ** 2));
  }
  const g = new THREE.LatheGeometry(pts, segs);
  g.rotateX(-Math.PI / 2);
  return g;
}
// 滚花（绕 Z 轴，用于镜头环）
function knurl(radius, z, count, ribH, mat, thickness) {
  const geo = new THREE.BoxGeometry(thickness || 0.11, 0.1, ribH);
  const inst = new THREE.InstancedMesh(geo, mat, count);
  const d = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    const a = i / count * Math.PI * 2;
    d.position.set(Math.cos(a) * radius, Math.sin(a) * radius, z);
    d.rotation.set(0, 0, a);
    d.updateMatrix();
    inst.setMatrixAt(i, d.matrix);
  }
  inst.instanceMatrix.needsUpdate = true;
  return inst;
}
// 滚花（绕 Y 轴，用于转盘）
function knurlY(radius, y, count, ribH, mat, thickness) {
  const geo = new THREE.BoxGeometry(thickness || 0.11, ribH, 0.1);
  const inst = new THREE.InstancedMesh(geo, mat, count);
  const d = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    const a = i / count * Math.PI * 2;
    d.position.set(Math.cos(a) * radius, y, Math.sin(a) * radius);
    d.rotation.set(0, -a, 0);
    d.updateMatrix();
    inst.setMatrixAt(i, d.matrix);
  }
  inst.instanceMatrix.needsUpdate = true;
  return inst;
}

/* ═══════════════ 部件注册 ═══════════════ */
const root = new THREE.Group();
scene.add(root);

const parts = [];
const pickables = [];

function part(group, name, desc, explode, labelOff) {
  group.userData.info = { name, desc };
  group.userData.base = group.position.clone();
  group.userData.explode = new THREE.Vector3(...explode);
  group.userData.labelOff = new THREE.Vector3(...(labelOff || [0, 1.5, 0]));
  group.traverse(o => {
    if (o.isMesh) { o.userData.part = group; pickables.push(o); }
  });
  parts.push(group);
  root.add(group);
  return group;
}

      gl_FragColor = vec4(base + hot * uGlow * (0.35 + 0.65*cell) * (0.5+0.5*edge), 1.0);

const state = {
  explode: 0,
  explodeTarget: 0,
  fStopIdx: 2,
  focus: 0.42,
  focusSmooth: 0.42,
  shooting: true,
  xray: true,

const fStops = [1.8, 2, 2.8, 4, 5.6, 8, 11, 16];
const CYCLE = 1.2;

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const smooth = t => t * t * (3 - 2 * t);
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, v0] = keys[i], [t1, v1] = keys[i + 1];
    if (t >= t0 && t <= t1) {
      const u = t1 === t0 ? 1 : clamp01((t - t0) / (t1 - t0));
      return v0 + (v1 - v0) * smooth(u);
    }
  }
  return keys[keys.length - 1][1];
}

const shotVals = t => ({
  mirror: kf(t, [[0, 0], [0.13, 1], [0.62, 1], [0.76, 0]]),
  stop: kf(t, [[0, 0], [0.07, 0], [0.18, 1], [0.64, 1], [0.78, 0]]),
  front: kf(t, [[0, 0], [0.17, 0], [0.27, 1], [0.44, 1], [0.56, 0]]),
  back: kf(t, [[0, 0], [0.31, 0], [0.40, 1], [0.44, 1], [0.56, 0]]),
  glow: kf(t, [[0, 0], [0.245, 0], [0.275, 1], [0.365, 0.9], [0.40, 0]])
});

function phaseText(t) {
  if (t < 0.10) return '待机 · 取景';
  if (t < 0.18) return '反光镜翻起';
  if (t < 0.27) return '光圈收缩';
  if (t < 0.31) return '前帘下扫';
  if (t < 0.40) return '曝光中';
  if (t < 0.46) return '后帘闭合';
  if (t < 0.56) return '帘幕复位';
  if (t < 0.76) return '反光镜回落';
  if (t < 0.90) return '光圈全开';
  return '待机 · 取景';
}

const emiCache = new Map();

function setHighlight(group, on) {
  group.traverse(o => {
    if (!o.isMesh || !o.material || !o.material.emissive) return;
    const m = o.material;
    if (on) {
      if (!emiCache.has(m)) emiCache.set(m, { c: m.emissive.getHex(), i: m.emissiveIntensity });
      m.emissive.setHex(0x2a7fb8);
      m.emissiveIntensity = 0.7;
    } else {
      const s = emiCache.get(m);
      if (s) { m.emissive.setHex(s.c); m.emissiveIntensity = s.i; }
    }
  });
}

/* ═══════════════ 动画 ═══════════════ */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
let labelTick = 0;
let appliedDolly = 1;
let lastGhost = -1;

function updateCurtains(v) {
  curtainFront.position.y = AXIS_Y - v.front * 2.7;
  curtainBack.position.y = 3.42 - v.back * 2.7;
}

function updateBeams(t, v, dt) {
  beamGroup.visible = state.beams;
  if (!state.beams) return;

  const exposing = t > 0.23 && t < 0.42;
  // 取景光路：反光镜落下时存在
  const viewOn = (1 - v.mirror) * (state.xray ? 1 : 0.55);
  viewBeam.material.opacity = 0.05 + viewOn * 0.34;
  viewFlow.children.forEach(m => m.material.opacity = 0);
  viewFlow.visible = viewOn > 0.2;

  shotBeam.material.opacity = exposing ? 0.34 : 0;
  shotFlow.visible = exposing;
  shotLight.material.opacity = v.glow * 0.55;

  const time = performance.now() / 1000;
  if (viewFlow.visible) {
    const c = viewBeam.userData.curve;
    viewFlow.userData.arr.forEach((m, i) => {
      const u = ((time * 0.32 + i / viewFlow.userData.count) % 1);
      c.getPointAt(u, tmpV);
      m.position.copy(tmpV);
      m.material.opacity = 0.75 * viewOn * Math.sin(u * Math.PI);
    });
  }
  if (shotFlow.visible) {
    const c = shotBeam.userData.curve;
    shotFlow.userData.arr.forEach((m, i) => {
      const u = ((time * 1.6 + i / shotFlow.userData.count) % 1);
      c.getPointAt(u, tmpV);
      m.position.copy(tmpV);
    });
  }
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);

  // 拍摄循环
  if (state.shooting) {
    const prevT = state.t;
    state.t += dt;
    if (state.t >= CYCLE) {
      state.t -= CYCLE;
      state.shots++;
    }
  }
  const v = shotVals(state.t);
  updateCurtains(v);
  updateBeams(state.t, v, dt);

  // 反光镜
  mirrorPivot.rotation.x = -v.mirror * 1.38;

  // 光圈
  state.aperture += ((1 - v.stop) - state.aperture) * Math.min(1, dt * 14);
  const openHole = 1.95;
  const closedHole = openHole * (1.8 / fStops[state.fStopIdx]);
  const hole = openHole + (closedHole - openHole) * v.stop;
  if (Math.abs(hole - irisState.hole) > 0.0005) {
    irisState.hole = hole;
    irisBlades.forEach(m => {
      m.position.y = hole;
      m.scale.y = Math.max(0.02, (2.95 - hole));
    });
  }

  // 光圈环转动
  apertureRing.userData.rot = apertureRing.userData.rot ?? 0;
  const rotT = -(state.fStopIdx) * 0.24;
  apertureRing.userData.rot += (rotT - apertureRing.userData.rot) * Math.min(1, dt * 6);
  apertureRing.rotation.z = apertureRing.userData.rot;

  // 对焦
  state.focusSmooth += (state.focus - state.focusSmooth) * Math.min(1, dt * 5);
  const fz = (state.focusSmooth - 0.5) * 1.15;
  focusRing.rotation.z = state.focusSmooth * 2.6;

  // 传感器辉光
  sensorMat.uniforms.uGlow.value = v.glow;
  exposureLight.intensity = v.glow * 5;

  // 爆炸
  state.explode += (state.explodeTarget - state.explode) * Math.min(1, dt * 4.2);
  const e = smooth(clamp01(state.explode));
  parts.forEach(p => {
    p.position.copy(p.userData.base).addScaledVector(p.userData.explode, e);
  });
  focusGlass.position.z = focusGlass.userData.base.z + focusGlass.userData.explode.z * e + fz;

  // 外壳透明度：透视开关 或 爆炸时自动透明
  const ghostLevel = state.xray ? 1 : Math.min(1, e * 1.6);
  if (Math.abs(ghostLevel - lastGhost) > 0.004) {
    lastGhost = ghostLevel;
    xrayMats.forEach(m => {
      const op = state.xray ? m.userData.baseOpacity : 1 - ghostLevel * 0.95;
      m.opacity = op;
      m.depthWrite = op > 0.6;
      m.transparent = op < 0.999;
    });
  }

  // 悬浮
  ray.setFromCamera(pointer, camera);
  const hits = ray.intersectObjects(pickables, false);
  if (hits.length) {
    applyHover(hits[0].object.userData.part || null);
  } else {
    applyHover(null);
  }

  // 标签
  labelTick += dt;
  if (labelTick > 0.016) {
    labelTick = 0;
    const w = window.innerWidth, h = window.innerHeight;
    const placed = [];
    const items = [];
    parts.forEach(p => {
      const el = p.userData.labelEl;
      if (e <= 0.015) { if (el.style.opacity !== '0') el.style.opacity = '0'; return; }
      tmpV.copy(p.userData.base).addScaledVector(p.userData.explode, e).add(p.userData.labelOff);
      tmpV.project(camera);
      const x = (tmpV.x * 0.5 + 0.5) * w;
      const y = (-tmpV.y * 0.5 + 0.5) * h;
      const outside = tmpV.z > 1 || x < -80 || x > w + 80 || y < -40 || y > h + 40;
      items.push({ el, x, y, outside });
    });
    items.sort((a, b) => a.y - b.y);
    items.forEach(it => {
      if (it.outside) { it.el.style.opacity = '0'; return; }
      let y = it.y;
      for (let pass = 0; pass < 3; pass++) {
        for (const q of placed) {
          if (Math.abs(q.x - it.x) < 132 && Math.abs(q.y - y) < 23) y = q.y + 23;
        }
      }
      it.y = y;
      placed.push({ x: it.x, y });
      it.el.style.opacity = String(Math.min(1, (e - 0.015) * 5));
      it.el.style.transform = `translate(-50%,-50%) translate(${it.x.toFixed(1)}px,${y.toFixed(1)}px)`;
    });
  }

  // 爆炸时自动拉远
  const dollyTarget = 1 + e * 0.8;
  if (Math.abs(dollyTarget - appliedDolly) > 1e-5) {
    const off = new THREE.Vector3().copy(camera.position).sub(controls.target);
    const len = THREE.MathUtils.clamp(off.length() * (dollyTarget / appliedDolly), controls.minDistance, controls.maxDistance);
    off.setLength(len);
    camera.position.copy(controls.target).add(off);
    appliedDolly = dollyTarget;
  }

  // UI
  updateReadout();

  controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
