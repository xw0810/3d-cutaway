<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>锁式线迹缝纫机 · 交互式 3D 机构剖面</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#06080b}
  body{
    font-family:"PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    color:#fff;-webkit-font-smoothing:antialiased;
    background:radial-gradient(ellipse 82% 68% at 52% 42%, #1d2229 0%, #101419 44%, #06080b 100%);
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(190,214,240,.032) 1px, transparent 1px),
      linear-gradient(90deg, rgba(190,214,240,.032) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(ellipse 74% 66% at 52% 44%, #000 10%, transparent 78%);
    mask-image:radial-gradient(ellipse 74% 66% at 52% 44%, #000 10%, transparent 78%);
  }
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:1}
  #c:active{cursor:grabbing}

  .hud{
    position:fixed;z-index:20;
    background:linear-gradient(180deg, rgba(26,32,39,.76), rgba(12,16,20,.66));
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    backdrop-filter:blur(18px) saturate(140%);
    border:1px solid rgba(214,182,125,.16);
    border-radius:16px;
    box-shadow:0 20px 54px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,232,190,.07);
  }
  .hud.tl{left:24px;top:24px;padding:16px 22px 18px}
  .eyebrow{font-size:9.5px;letter-spacing:.36em;color:rgba(224,190,130,.58);margin-bottom:9px}
  .hud h1{font-size:24px;font-weight:600;letter-spacing:.05em;line-height:1.1;
    background:linear-gradient(180deg,#fff 0%,#f0cf96 130%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hud .sub{font-size:11.5px;color:rgba(255,255,255,.43);margin-top:8px;letter-spacing:.05em}

  .hud.tr{right:24px;top:24px;padding:10px;display:flex;flex-direction:column;gap:7px}
  button{
    font-family:inherit;font-size:12px;letter-spacing:.05em;color:rgba(255,255,255,.9);cursor:pointer;
    border:1px solid rgba(224,190,130,.2);border-radius:10px;
    background:linear-gradient(180deg,rgba(255,235,200,.09),rgba(255,235,200,.02));
    padding:8px 14px;min-width:154px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .18s cubic-bezier(.2,.8,.3,1),background .2s,border-color .2s,box-shadow .25s,color .2s;
  }
  button:hover{transform:translateY(-1px);border-color:rgba(224,190,130,.5);background:linear-gradient(180deg,rgba(255,235,200,.17),rgba(255,235,200,.04))}
  button:active{transform:translateY(0) scale(.985)}
  button.on{
    background:linear-gradient(180deg,#dcae63,#a4752b);
    border-color:rgba(255,215,150,.62);color:#241804;
    box-shadow:0 8px 26px rgba(220,174,99,.34), inset 0 1px 0 rgba(255,255,255,.35);
    font-weight:600;
  }
  button.ghost{font-size:11px;padding:7px 12px;min-width:0;color:rgba(255,255,255,.5);background:rgba(255,255,255,.02)}
  button.ghost:hover{color:#fff}
  .ico{font-size:11px;line-height:1;opacity:.9}

  .hud.bl{left:24px;bottom:24px;padding:13px 18px;display:flex;flex-direction:column;gap:8px;min-width:274px}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:18px;font-size:11.5px}
  .row .k{color:rgba(255,255,255,.34);letter-spacing:.12em;white-space:nowrap}
  .row .v{color:rgba(255,255,255,.86);letter-spacing:.04em;text-align:right;font-variant-numeric:tabular-nums}
  .v.warm{color:#f0c27d}
  .v.ok{color:#6fe6c4}
  .rule{margin-top:4px;padding-top:9px;border-top:1px solid rgba(255,255,255,.09);
    font-size:10.5px;line-height:1.65;color:rgba(255,255,255,.44);max-width:268px}
  .rule b{color:#f0c27d;font-weight:600}
  .legend{display:flex;gap:16px;margin-top:8px;font-size:10.5px;color:rgba(255,255,255,.52)}
  .legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
  .dotUp{background:#ffb95e;box-shadow:0 0 8px rgba(255,185,94,.7)}
  .dotLow{background:#63e0cf;box-shadow:0 0 8px rgba(99,224,207,.7)}

  .hud.br{right:24px;bottom:24px;padding:10px 15px;pointer-events:none}
  .hint{font-size:11px;color:rgba(255,255,255,.36);letter-spacing:.08em}

  .steps{
    position:fixed;z-index:20;left:50%;bottom:26px;transform:translateX(-50%);
    display:flex;gap:6px;padding:7px;border-radius:14px;
    background:linear-gradient(180deg,rgba(26,32,39,.74),rgba(12,16,20,.66));
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border:1px solid rgba(214,182,125,.15);
    box-shadow:0 18px 44px rgba(0,0,0,.5);
  }
  .step{
    display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:9px;
    font-size:10.5px;letter-spacing:.03em;color:rgba(255,255,255,.38);white-space:nowrap;
    border:1px solid transparent;transition:all .25s;
  }
  .step i{
    display:flex;align-items:center;justify-content:center;font-style:normal;
    width:17px;height:17px;border-radius:50%;font-size:9.5px;
    background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);transition:all .25s;
  }
  .step.on{color:#ffe4b8;background:rgba(224,174,99,.14);border-color:rgba(224,174,99,.42)}
  .step.on i{background:#dcae63;color:#241804;font-weight:700}

  #labels{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
  .lbl{
    position:absolute;left:0;top:0;
    font-size:10px;letter-spacing:.06em;white-space:nowrap;
    color:#ffeccd;background:rgba(22,27,33,.8);
    border:1px solid rgba(224,190,130,.38);
    padding:3px 8px;border-radius:8px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    box-shadow:0 8px 22px rgba(0,0,0,.45);
    opacity:0;transition:opacity .2s;will-change:transform;
  }
  .lbl::before{content:'';position:absolute;left:-4px;top:50%;width:6px;height:6px;margin-top:-3px;
    border-radius:50%;background:#e8bb74;box-shadow:0 0 8px rgba(232,187,116,.9)}

  .tip{
    position:fixed;z-index:30;left:0;top:0;pointer-events:none;
    max-width:290px;padding:9px 13px;border-radius:11px;
    background:rgba(20,25,31,.9);border:1px solid rgba(224,190,130,.32);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 12px 34px rgba(0,0,0,.6);
    opacity:0;transform:translate(-50%,-140%);transition:opacity .14s;
  }
  .tip .t{font-size:12px;color:#f4cf95;letter-spacing:.06em;margin-bottom:4px;font-weight:600}
  .tip .d{font-size:11px;line-height:1.55;color:rgba(255,255,255,.66);letter-spacing:.02em}

  .callout{
    position:fixed;z-index:16;pointer-events:none;left:0;top:0;
    padding:5px 10px;border-radius:9px;white-space:nowrap;
    background:rgba(52,34,14,.78);border:1px solid rgba(255,190,105,.42);
    box-shadow:0 8px 26px rgba(0,0,0,.45);
    font-size:11px;letter-spacing:.05em;color:#ffd79b;
    opacity:0;transition:opacity .2s;transform:translate(-50%,-50%);
  }
  .fadein{animation:fade .8s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (max-width:1100px){
    .steps{bottom:auto;top:96px;left:24px;transform:none;flex-direction:column;padding:6px}
    .step{font-size:10px;padding:5px 9px}
    .hud.br{display:none}
  }
  @media (max-width:820px){
    .hud.tl{left:12px;top:12px;padding:11px 14px 13px}
    .hud h1{font-size:17px}
    .hud .sub{font-size:10px}
    .hud.tr{right:12px;top:12px;padding:7px;gap:5px}
    button{min-width:112px;font-size:11px;padding:7px 10px}
    .hud.bl{left:12px;bottom:12px;padding:9px 12px;min-width:0}
    .row{font-size:10px}
    .rule{display:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="tip" class="tip"></div>
<div id="callout" class="callout"></div>

<header class="hud tl fadein">
  <div class="eyebrow">锁式线迹 · 机构剖面</div>
  <h1>缝纫机 · 一针是怎么缝出来的</h1>
  <div class="sub">针微升一点点 → 线滞后成环 → 旋梭勾住 → 挑线收紧 → 送布一针</div>
</header>

<div class="hud tr fadein">
  <button id="btnExplode"><span class="ico">✦</span><span id="lbExplode">爆炸视图</span></button>
  <button id="btnPause"><span class="ico">❚❚</span><span id="lbPause">暂停</span></button>
  <button id="btnSlow"><span class="ico">◷</span><span id="lbSlow">慢动作</span></button>
  <button id="btnZoom"><span class="ico">◎</span><span>机头特写</span></button>
  <button id="btnUnder"><span class="ico">⊙</span><span>针板仰视</span></button>
  <button id="btnGhost"><span class="ico">◌</span><span id="lbGhost">透视外壳</span></button>
  <button id="btnReset" class="ghost">重置视角</button>
</div>

<div class="hud bl fadein">
  <div class="row"><span class="k">当前阶段</span><span class="v warm" id="phase">针在下死点</span></div>
  <div class="row"><span class="k">机 针</span><span class="v" id="needleInfo">下死点</span></div>
  <div class="row"><span class="k">旋 梭</span><span class="v" id="hookInfo">0°</span></div>
  <div class="row"><span class="k">已缝针数</span><span class="v" id="cnt">0 针</span></div>
  <div class="row"><span class="k">缝 速</span><span class="v ok" id="speed">3 针 / 秒</span></div>
  <div class="legend"><span><i class="dotUp"></i>面线（上线团）</span><span><i class="dotLow"></i>底线（下梭芯）</span></div>
  <div class="rule"><b>关键一瞬：</b>针从最低点只回升约两毫米，线被布的摩擦拖住、跟不上针，就在针眼下方鼓出一个线环 —— 旋梭的尖嘴正好在这一刻赶到。</div>
</div>

<div class="hud br fadein">
  <div class="hint">拖拽环绕 · 滚轮缩放（可钻到针板下方）· 右键平移 · 悬停查看部件</div>
</div>

<div class="steps fadein" id="steps">
  <div class="step" data-i="0"><i>1</i>针微升 · 线滞后成环</div>
  <div class="step" data-i="1"><i>2</i>旋梭尖勾住线环</div>
  <div class="step" data-i="2"><i>3</i>绕过梭芯套一整圈</div>
  <div class="step" data-i="3"><i>4</i>挑线杆收紧线结</div>
  <div class="step" data-i="4"><i>5</i>送布牙推进一针</div>
  <div class="step" data-i="5"><i>6</i>机针重新刺布</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ==================================================================
   一、关键尺寸（1 单位 ≈ 2 厘米，机构做了适度放大以便看清）
   ================================================================== */
const PI = Math.PI;
const V  = (x,y,z)=>new THREE.Vector3(x,y,z);
const NX = -5.20;                 // 机针所在 X
const NZ =  0.70;                 // 机针所在 Z（同时也是送布方向上的起点）
const L  =  0.38;                 // 一针的针距
const STROKE = 1.20;              // 针杆行程
const SEAM_N = 8;                 // 已缝好的针数（接缝只完成一半）
const CYCLE_FAST = 1/3;           // 每秒三针
const CYCLE_SLOW = 1.65;

const BED = { x0:-7.2, x1:7.2, z0:-3.4, z1:3.4, topY:0, botY:-1.25 };
const PLATE = { x0:-6.75, x1:-3.65, z0:-1.15, z1:2.55 };
const HAND = { x:8.0, y:5.55, z:0.45, r:1.50 };
const FLY  = { x:8.0, y:-4.30, z:0.45, r:1.90 };
const HOOK_Y = -1.20;             // 旋梭 / 梭芯中心高度
const BOB_R  = 0.62;              // 梭芯套半径
const HOOK_R = 0.80;              // 旋梭尖嘴回转半径
const CRANK_Y = 5.20, CRANK_R = 0.60, ROD_L = 1.10;

const C_UP  = 0xffb95e;           // 面线
const C_LOW = 0x63e0cf;           // 底线

/* ==================================================================
   二、渲染器 / 场景 / 相机 / 灯光
   ================================================================== */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.03, 260);
const HOME_POS = V(16.0, 6.8, 21.8);
const HOME_TGT = V(0.2, -0.25, 0.3);
camera.position.copy(HOME_POS);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.rotateSpeed = 0.80;
controls.zoomSpeed = 0.95;
controls.panSpeed = 0.75;
controls.minDistance = 0.42;      // 可以一直推到针板底下
controls.maxDistance = 46;
controls.maxPolarAngle = PI*0.97; // 允许翻到底面朝上看
controls.update();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;

const lKey  = new THREE.DirectionalLight(0xfff1dc, 2.35); lKey.position.set(11, 12, 11);
const lFront= new THREE.DirectionalLight(0xffffff, 1.30); lFront.position.set(6, 2, 15);
const lFill = new THREE.DirectionalLight(0x9dc0ff, 0.95); lFill.position.set(-10, 3, -7);
const lRim  = new THREE.DirectionalLight(0xffc98c, 1.55); lRim.position.set(-7, 8, -9);
const lLow  = new THREE.DirectionalLight(0x8fd6e0, 0.75); lLow.position.set(-3, -8, 6);
const lHead = new THREE.DirectionalLight(0xffd9a8, 1.55); lHead.position.set(-12, 4, 11);
const lUnder= new THREE.DirectionalLight(0xbfe9ff, 0.95); lUnder.position.set(-8, -4, 9);
scene.add(lKey, lFront, lFill, lRim, lLow, lHead, lUnder,
          new THREE.HemisphereLight(0x9db4ce, 0x170f08, 0.5));

/* ==================================================================
   三、基础材质
   ================================================================== */
const B = {
  iron:    new THREE.MeshStandardMaterial({ color:0x303841, metalness:0.60, roughness:0.46, envMapIntensity:1.55 }),
  ironCut: new THREE.MeshStandardMaterial({ color:0x6b747e, metalness:0.42, roughness:0.74, envMapIntensity:1.15 }),
  ironDark:new THREE.MeshStandardMaterial({ color:0x242c34, metalness:0.55, roughness:0.58, envMapIntensity:1.25 }),
  gold:    new THREE.MeshStandardMaterial({ color:0xc9a15a, metalness:0.92, roughness:0.28, envMapIntensity:2.10 }),
  goldDim: new THREE.MeshStandardMaterial({ color:0x8d703f, metalness:0.86, roughness:0.40, envMapIntensity:1.60 }),
  steel:   new THREE.MeshStandardMaterial({ color:0xc4ccd4, metalness:1.0, roughness:0.21, envMapIntensity:2.05 }),
  steelDk: new THREE.MeshStandardMaterial({ color:0x828e99, metalness:0.94, roughness:0.34, envMapIntensity:1.65 }),
  brass:   new THREE.MeshStandardMaterial({ color:0xc28b3e, metalness:0.92, roughness:0.30, envMapIntensity:2.00 }),
  leather: new THREE.MeshStandardMaterial({ color:0x51301c, metalness:0.05, roughness:0.82, envMapIntensity:0.85 }),
  clothA:  new THREE.MeshStandardMaterial({ color:0xc4a67f, metalness:0.0, roughness:0.96, side:THREE.DoubleSide,
             transparent:true, opacity:0.62, depthWrite:false }),
  clothB:  new THREE.MeshStandardMaterial({ color:0x628899, metalness:0.0, roughness:0.96, side:THREE.DoubleSide,
             transparent:true, opacity:0.62, depthWrite:false }),
  up:      new THREE.MeshStandardMaterial({ color:C_UP,  emissive:0x6b3200, emissiveIntensity:0.55, metalness:0.05, roughness:0.52 }),
  low:     new THREE.MeshStandardMaterial({ color:C_LOW, emissive:0x0a5a52, emissiveIntensity:0.50, metalness:0.05, roughness:0.52 }),
  knot:    new THREE.MeshStandardMaterial({ color:0xffe1a6, emissive:0xff9c3a, emissiveIntensity:0.95, roughness:0.45 }),
  ghost:   new THREE.MeshBasicMaterial({ color:0x8bb4cc, transparent:true, opacity:0.045, depthWrite:false, side:THREE.DoubleSide }),
  dark:    new THREE.MeshStandardMaterial({ color:0x0c1013, metalness:0.35, roughness:0.85 })
};
const edgeFront = new THREE.LineBasicMaterial({ color:0xb9d0e0, transparent:true, opacity:0.20 });
const edgeCut   = new THREE.LineBasicMaterial({ color:0xe0bd7e, transparent:true, opacity:0.32 });
const edgeGold  = new THREE.LineBasicMaterial({ color:0xe6c384, transparent:true, opacity:0.55 });

/* ==================================================================
   四、部件登记：悬停高亮 / 一句话说明 / 爆炸位移 / 标签锚点
   ================================================================== */
const ROOT = new THREE.Group(); scene.add(ROOT);
const PARTS = {}, partOrder = [], pickables = [], shellMats = [], ghostMats = [];

function P(id, name, desc, ex, anchor, parent){
  const exGroup = new THREE.Group();
  (parent || ROOT).add(exGroup);
  const group = new THREE.Group();
  exGroup.add(group);
  const p = { id, name, desc, exGroup, group, mats:[], ex:V(ex[0],ex[1],ex[2]),
              anchor:V(anchor[0],anchor[1],anchor[2]) };
  PARTS[id] = p; partOrder.push(p);
  return p;
}
/** 往部件里放一个网格；材质各自克隆，保证高亮只影响当前部件 */
function A(p, geo, matBase, pos, rot, flags){
  const mat = Array.isArray(matBase) ? matBase.map(m=>m.clone()) : matBase.clone();
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(pos[0],pos[1],pos[2]);
  if (rot) m.rotation.set(rot[0],rot[1],rot[2]);
  m.userData.part = p;
  p.group.add(m);
  (Array.isArray(mat)?mat:[mat]).forEach(x=>{
    p.mats.push(x);
    if (flags && flags.shell) shellMats.push(x);
    if (flags && flags.ghost) ghostMats.push(x);
  });
  if (!(flags && flags.noPick)) pickables.push(m);
  return m;
}
/** 只做装饰、不参与拾取与高亮 */
function D(parent, geo, mat, pos, rot){
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(pos[0],pos[1],pos[2]);
  if (rot) m.rotation.set(rot[0],rot[1],rot[2]);
  parent.add(m); return m;
}
const box = (w,h,d)=>new THREE.BoxGeometry(w,h,d);
const cyl = (r1,r2,h,s=24)=>new THREE.CylinderGeometry(r1,r2,h,s);
const tor = (r,t,s=32,arc=PI*2)=>new THREE.TorusGeometry(r,t,8,s,arc);
function bx(p,w,h,d,x,y,z,mat,rot,flags){ return A(p, box(w,h,d), mat, [x,y,z], rot, flags); }
function cy(p,r1,r2,h,x,y,z,mat,rot,flags,s){ return A(p, cyl(r1,r2,h,s||24), mat, [x,y,z], rot, flags); }
function tr(p,r,t,x,y,z,mat,rot,flags,arc){ return A(p, tor(r,t,48,arc||PI*2), mat, [x,y,z], rot, flags); }
function edges(mesh, mat, angle){
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, angle||24), mat);
  mesh.add(e); return e;
}
/** 动态线：几何体每帧重建，但挂在自己的部件组里，爆炸时整体平移 */
function threadPart(id,name,desc,radius,ex,anchor,mat){
  const p = P(id,name,desc,ex,anchor);
  const m = new THREE.Mesh(cyl(0.001,0.001,0.001,3), mat.clone());
  m.userData.part = p; p.group.add(m); p.mats.push(m.material); pickables.push(m);
  p.thread = m; p.radius = radius; return p;
}
function setTube(mesh, pts, radius, closed, seg){
  if (!pts || pts.length < 2) return;
  const curve = new THREE.CatmullRomCurve3(pts, !!closed, 'centripetal', 0.4);
  const n = seg || Math.max(28, pts.length*4);
  const g = new THREE.TubeGeometry(curve, n, radius, 6, !!closed);

/* ==================================================================
   十五、时间轴：一针 = 一个完整周期（每秒三针）
   ================================================================== */
function kf(list, t){
  if (t <= list[0][0]) return list[0][1];
  for (let i=0;i<list.length-1;i++){
    const a=list[i], b=list[i+1];
    if (t>=a[0] && t<=b[0]){
      let u=(t-a[0])/Math.max(1e-6,b[0]-a[0]);
      u = u*u*(3-2*u);
      return a[1]+(b[1]-a[1])*u;
    }
  }
  return list[list.length-1][1];
}

/* ==================================================================
   十七、每帧求解机构
   ================================================================== */
function solve(t){
  /* 曲柄滑块：针杆位置由曲柄角度严格解出，不是随便的正弦 */
  const a = 2*PI*t - PI/2;
  const cs = Math.cos(a), sn = Math.sin(a);
  const pin = V(NX + CRANK_R*cs, CRANK_Y + CRANK_R*sn, 0.52);
  const sliderY = CRANK_Y + CRANK_R*sn - Math.sqrt(ROD_L*ROD_L - (CRANK_R*cs)*(CRANK_R*cs));
  const needleOff = sliderY - 3.50;                 // 0 = 下死点
  const needleEyeY = -0.44 + needleOff;
  const needleTipY = -0.58 + needleOff;

  /* 曲柄销 + 连杆 */
  crankPin.position.copy(pin);
  tmpA.set(NX, sliderY, 0.52);
  tmpB.subVectors(pin, tmpA);
  rodMesh.position.copy(tmpA).add(pin).multiplyScalar(0.5);
  rodMesh.scale.y = tmpB.length();
  rodMesh.quaternion.setFromUnitVectors(V(0,1,0), tmpB.clone().normalize());

  pBar.group.position.y = needleOff;

  /* 挑线杆 */
  const deg = kf(TL.takeup, t) * PI/180;
  const theta = deg;
  pTakeup.tkArm.rotation.z = PI - theta;
  const eye = V(TKP.x - 1.05*Math.cos(theta), TKP.y + 1.05*Math.sin(theta), TKP.z+0.02);

  /* 手轮 / 大飞轮 / 皮带 / 踏板 */
  pHand.group.rotation.x = -2*PI*t;
  pFly.group.rotation.x  = -2*PI*t*(HAND.r/FLY.r);
  const beltPhase = (t*0.55)%1;
  beltBeads.forEach((s,i)=>{
    const u = (i/beltBeads.length + beltPhase)%1;
    s.position.copy(beltCurve.getPointAt(u));
  });
  const fa = pFly.group.rotation.x + 0.6;
  const crankPt = V(FLY.x, FLY.y + 1.72*Math.cos(fa), FLY.z + 1.72*Math.sin(fa));
  const pedalPt = V(FLY.x, -6.66, FLY.z + 1.02);
  tmpB.subVectors(crankPt, pedalPt);
  pitman.position.copy(crankPt).add(pedalPt).multiplyScalar(0.5);
  pitman.scale.y = tmpB.length();
  pitman.quaternion.setFromUnitVectors(V(0,1,0), tmpB.clone().normalize());
  treadleBoard.rotation.x = Math.sin(2*PI*t)*0.055;

  /* 送布牙 + 布料 + 线迹：走一个针距后图案正好重复，回位不可见 */
  const fw = kf(TL.feed, t);
  const lift = Math.sin(PI*fw)*0.145;
  pFeed.group.position.y = lift;
  pFeed.group.position.z = L*(fw-0.5);
  pCloth.group.position.z = L*fw;
  pSeam.group.position.z  = L*fw;

  /* 旋梭：每针两转，t=0.15 时尖嘴正好转到机针后方 */
  const hookRot = -4*PI*(t-0.15);
  pHook.group.rotation.z = hookRot;

  /* 面线上段：线团 → 导线钩 → 夹线器 → 挑线杆 → 针杆 → 针眼 */
  const up = [];
  up.push(V(2.0, 7.48, 0.20));
  up.push(V(1.90, 7.62, 0.34));
  up.push(GUIDE_PTS[0]);
  up.push(GUIDE_PTS[1]);
  up.push(GUIDE_PTS[2]);
  up.push(GUIDE_PTS[3]);
  up.push(V(TX+0.02, TY+0.22, TZ));
  up.push(V(TX, TY, TZ));                 // 穿过两片张力盘
  up.push(V(TX-0.20, TY-0.18, TZ));
  up.push(V(-5.15, 4.15, 1.05));
  up.push(eye);                           // 挑线杆眼
  up.push(V(-5.30, 3.55, 1.02));
  up.push(GUIDE_PTS[4]);
  up.push(GUIDE_PTS[5]);
  up.push(V(NX+0.16, 1.02+needleOff, NZ+0.20));   // 针夹上的过线钩，随针杆升降
  up.push(V(NX, needleEyeY, NZ));
  setTube(pUpper.thread, up, pUpper.radius, false, 150);

  /* 线环：从针眼往下穿过布，绕梭芯套一圈，再回到上一针的线结 */
  const la = kf(TL.loopAmt, t), lw = kf(TL.loopWrap, t), tight = kf(TL.tighten, t);
  const knotZ = NZ + L*fw;
  const lp = [];
  lp.push(V(NX, needleEyeY, NZ));
  lp.push(V(NX, 0.16, NZ));
  lp.push(V(NX, -0.20, NZ-0.04));
  if (la > 0.02){
    const sweep = 2*PI*lw;
    const n = 26, r = 0.90 + 0.05*la;
    for(let i=0;i<=n;i++){
      const ang = PI/2 - (i/n)*sweep;
      lp.push(V(NX + Math.cos(ang)*r, HOOK_Y + Math.sin(ang)*r, NZ-0.30));
    }
  }
  lp.push(V(NX, -0.14, NZ+0.10));
  lp.push(V(NX, 0.035, knotZ));
  setTube(pLoop.thread, lp, pLoop.radius, false, 130);

  /* 底线：从梭芯引出，沿布的背面一路穿过每个互锁点 */
  const lo = [];
  lo.push(V(NX-0.55, HOOK_Y+0.52, NZ+0.22));   // 梭芯套上的底线张力簧
  lo.push(V(NX-0.62, HOOK_Y+0.12, NZ+0.06));
  lo.push(V(NX-0.34, -0.42, NZ+0.04));
  lo.push(V(NX, 0.012, knotZ));
  for(let k=1;k<=SEAM_N;k++) lo.push(V(NX, 0.008, NZ+k*L+L*fw));
  setTube(pLower.thread, lo, pLower.radius, false, 120);

  /* 收紧动画：线结从布下被提到布层中间 */
  const ky = -0.42 + 0.458*tight;
  knotNow.position.set(NX, ky, knotZ);
  const sc = 0.35 + 0.85*tight;
  knotNow.scale.setScalar(sc);
  halo.position.set(NX, ky, knotZ);
  halo.rotation.x = PI/2;
  halo.scale.setScalar(0.6 + 0.7*tight);
  halo.material.opacity = 0.15 + 0.55*tight;
  halo.visible = tight > 0.02;

  return { t, needleOff, needleTipY, hookRot, fw, tight, la, lw, eye };
}

/* ==================================================================
   十八、渲染循环
   ================================================================== */
function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.10);

  /* 爆炸插值 */
  const target = exploded ? 1 : 0;
  explodeAmt += (target-explodeAmt)*Math.min(1, dt*6.5);
  if (Math.abs(target-explodeAmt)<0.0015) explodeAmt = target;
  const k = explodeAmt*explodeAmt*(3-2*explodeAmt);
  for (const p of partOrder) p.exGroup.position.copy(p.ex).multiplyScalar(k);

  /* 时间轴 */
  if (!exploded && playing){
    const cycle = slow ? CYCLE_SLOW : CYCLE_FAST;
    prevT = tNorm;
    tNorm += dt/cycle;
    if (tNorm >= 1){ tNorm -= 1; stitchCount++; }
  }
  const st = solve(exploded ? 0.0 : tNorm);

  /* 同步动作的部件微微发光（悬停时更亮） */
  let active = null;
  if (tNorm < 0.10) active = 'needle';
  else if (tNorm < 0.40) active = 'hook';
  else if (tNorm < 0.54) active = 'takeup';
  else if (tNorm < 0.74) active = 'feed';
  else active = 'bar';
  for (const p of partOrder){
    const isHover = (p===hovered);
    const isAct = (p.id===active) && !exploded;
    const ec = isHover ? 0xd9902c : 0xb4762b;
    const ei = isHover ? 0.65 : (isAct ? 0.24 : 0.0);
    for (const m of p.mats){
      if (m.emissive){
        if (!isHover && !isAct && m.userData.baseEmissive!==undefined){
          m.emissive.setHex(m.userData.baseEmissive);
          m.emissiveIntensity = m.userData.baseIntensity;
        } else {
          if (m.userData.baseEmissive===undefined){
            m.userData.baseEmissive = m.emissive.getHex();
            m.userData.baseIntensity = m.emissiveIntensity;
          }
          m.emissive.setHex(ec);
          m.emissiveIntensity = ei;
        }
      }
    }
  }

  /* 标签：贪心去重叠 */
  const labelOn = explodeAmt > 0.22;
  const placed = [];
  for (const it of labelItems){
    if (!labelOn){ it.el.style.opacity = 0; continue; }
    it.o.getWorldPosition(tmpV);
    tmpV.project(camera);
    if (tmpV.z>1){ it.el.style.opacity=0; continue; }
    const x=(tmpV.x*0.5+0.5)*innerWidth, y=(-tmpV.y*0.5+0.5)*innerHeight;
    if (x<0||x>innerWidth||y<0||y>innerHeight){ it.el.style.opacity=0; continue; }
    let chosen = null;
    for (const dy of [0,-22,22,-44,44,-66,66,-88,88,-110,110]){
      const yy = y+dy;
      let ok = true;
      for (const r of placed){ if (Math.abs(x-r.x)<Math.max(88,r.w) && Math.abs(yy-r.y)<19){ ok=false; break; } }
      if (ok){ chosen=yy; break; }
    }
    if (chosen===null || chosen<8 || chosen>innerHeight-8){ it.el.style.opacity=0; continue; }
    const w = it.el.offsetWidth || 80;
    placed.push({x,y:chosen,w});
    it.el.style.opacity = Math.min(1,(explodeAmt-0.22)*2.6);
    it.el.style.transform = `translate(${x}px, ${chosen}px) translate(-50%,-50%)`;
  }

  /* 针板旁的浮动说明 */
  const callout = document.getElementById('callout');
  if (exploded){ callout.style.opacity=0; }
  else {
    tmpV.set(NX, -0.48, NZ+1.55).project(camera);
    callout.style.left = ((tmpV.x*0.5+0.5)*innerWidth)+'px';
    callout.style.top  = ((-tmpV.y*0.5+0.5)*innerHeight)+'px';
    callout.textContent = PHASE_NOTE[stepIndex(tNorm)];
    callout.style.opacity = 0.92;
  }

  /* 底部阶段条 + 数据 */
  hudTick += dt;
  if (hudTick > 0.07){ hudTick=0; updateHUD(st); }

  /* 相机缓动 */
  if (camGoal){
    const kk = Math.min(1, dt*3.0);
    camera.position.lerp(camGoal.pos, kk);
    controls.target.lerp(camGoal.tgt, kk);
    if (camera.position.distanceTo(camGoal.pos)<0.03) camGoal=null;
  }

  controls.update();
  renderer.render(scene, camera);
}

/* ==================================================================
   十九、界面数值
   ================================================================== */
const elPhase=document.getElementById('phase'), elNeedle=document.getElementById('needleInfo');
const elHook=document.getElementById('hookInfo'), elCnt=document.getElementById('cnt');
const elSpeed=document.getElementById('speed');
const stepEls=[...document.querySelectorAll('.step')];
function updateHUD(st){
  const si = stepIndex(tNorm);
  elPhase.textContent = exploded ? '爆炸分解 · 逐层查看' : TL.phase[si][1];
  stepEls.forEach((e,i)=>e.classList.toggle('on', !exploded && i===si));

  const up = st.needleOff;
  elNeedle.textContent = up<0.10 ? '下死点' :
    (up<0.30 ? `回升 ${(up*20).toFixed(0)} 毫米 · 成环` :
    (up>1.05 ? '上死点' : (st.needleTipY>0.076 ? '离开布料 · 上升中' : '刺布 · 下降中')));
  elHook.textContent = (((-st.hookRot*180/PI)%360+360)%360).toFixed(0)+'°';
  elCnt.textContent = stitchCount+' 针';
  elSpeed.textContent = playing ? (slow?'0.6 针 / 秒':'3 针 / 秒') : '已暂停';
  elSpeed.className = 'v ' + (playing?'ok':'warm');
}

/* ==================================================================
   二十、交互：悬停 / 按钮
   ================================================================== */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2(-10,-10);
let ptrDirty=false, ptrInside=false;
const tip = document.getElementById('tip');
renderer.domElement.addEventListener('pointermove', e=>{
  ptr.x=(e.clientX/innerWidth)*2-1;
  ptr.y=-(e.clientY/innerHeight)*2+1;
  ptrDirty=true; ptrInside=true;
  tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px';
});
renderer.domElement.addEventListener('pointerleave', ()=>{ ptrInside=false; ptrDirty=true; });
function pick(){
  if (!ptrDirty || !ptrInside) return;
  ptrDirty=false;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(pickables, false);
  let part=null;
  for (const h of hits){ if (h.object.userData.part){ part=h.object.userData.part; break; } }
  if (part!==hovered){
    hovered=part;
    if (part){
      tip.innerHTML=`<div class="t">${part.name}</div><div class="d">${part.desc}</div>`;
      tip.style.opacity=1;
      renderer.domElement.style.cursor='pointer';
    } else {
      tip.style.opacity=0;
      renderer.domElement.style.cursor='grab';
    }
  }
}
setInterval(pick, 55);

const btnExplode=document.getElementById('btnExplode');
const btnPause=document.getElementById('btnPause');
const btnSlow=document.getElementById('btnSlow');
const btnZoom=document.getElementById('btnZoom');
const btnUnder=document.getElementById('btnUnder');
const btnGhost=document.getElementById('btnGhost');
const btnReset=document.getElementById('btnReset');

btnExplode.addEventListener('click', ()=>{
  exploded=!exploded;
  btnExplode.classList.toggle('on', exploded);
  document.getElementById('lbExplode').textContent = exploded?'复位合拢':'爆炸视图';
  if (exploded){
    tip.style.opacity=0; hovered=null;
    camGoal={pos:V(22.5,9.6,27.5), tgt:V(0.3,0.8,0.4)};
  } else {
    camGoal={pos:HOME_POS.clone(), tgt:HOME_TGT.clone()};
  }
});
btnPause.addEventListener('click', ()=>{
  playing=!playing;
  btnPause.classList.toggle('on', !playing);
  document.getElementById('lbPause').textContent = playing?'暂停':'继续';
});
btnSlow.addEventListener('click', ()=>{
  slow=!slow;
  btnSlow.classList.toggle('on', slow);
  document.getElementById('lbSlow').textContent = slow?'恢复常速':'慢动作';
});
btnZoom.addEventListener('click', ()=>{
  /* 从针杆一路框到梭床：挑线、夹线、压脚、旋梭、梭芯同屏 */
  camGoal={pos:V(NX+5.0, 2.35, NZ+9.4), tgt:V(NX, 2.10, NZ)};
});
btnUnder.addEventListener('click', ()=>{
  /* 翻到针板底下，从下往上看线环怎么被旋梭带走 */
  camGoal={pos:V(NX+3.0, -2.35, NZ+4.5), tgt:V(NX, -0.85, NZ)};
});
btnGhost.addEventListener('click', ()=>{
  ghostOn=!ghostOn;
  btnGhost.classList.toggle('on', ghostOn);
  document.getElementById('lbGhost').textContent = ghostOn?'恢复外壳':'透视外壳';
  shellMats.forEach(m=>{
    m.transparent=ghostOn;
    m.opacity=ghostOn?0.13:1;
    m.depthWrite=!ghostOn;
    m.needsUpdate=true;
  });
  ghostMats.forEach(m=>{ m.opacity = ghostOn?0.015:0.045; });
});
btnReset.addEventListener('click', ()=>{
  camGoal={pos:HOME_POS.clone(), tgt:HOME_TGT.clone()};
});

/* ==================================================================
   二十一、自适应 + 启动
   ================================================================== */
function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
frame();
</script>
